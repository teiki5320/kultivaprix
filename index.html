<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi des dossiers</title>
<style>
[hidden] { display: none !important; }
/* design « Suivi des dossiers » (Claude design) : fond sable, cartes blanches avec un bandeau de couleur, accent orange */
:root {
  --fond: #EDE4D6; --carte: #fff; --doux: #F3F1ED; --doux-2: #F1EFEB; --doux-3: #F7F5F1;
  --texte: #1A1A1A; --muted: #777; --ligne: #EEECE8;
  --orange: #E8701A; --orange-fonce: #C45B10; --peche: #FBE3CF; --peche-ink: #7A3E0F;
  --rouge: #C0392B; --accent-dim: rgba(232, 112, 26, .25);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
.page { max-width: 1180px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 16px; }

/* barre du haut : pilule noire */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #111; color: #fff; border-radius: 999px; padding: 14px 24px; }
header.top h1 { margin: 0; font-size: 20px; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: relative; }
.btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; background: var(--doux-2); color: var(--texte); transition: filter .12s, transform .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-dim); }
.btn-mini { padding: 5px 12px; font-size: 12px; }
header .btn { background: #333; color: #fff; }
.btn-accent, header .btn-accent { background: var(--orange); color: #fff; }

/* menu « Nouveau projet » : les 5 types de dossier */
.menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; min-width: 260px; background: #fff; color: var(--texte); border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px; }
.menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.menu button:hover:not(:disabled) { background: var(--peche); }
.menu button:disabled { cursor: default; color: var(--muted); opacity: .7; }
.menu small { font-weight: 600; font-size: 11.5px; color: var(--muted); }

/* cartes : bandeau de titre en couleur */
.card { background: var(--carte); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bandeau { margin: -18px -20px 0; padding: 12px 20px; border-radius: 14px 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
.b-rech { background: #6F6B66; } .b-cours { background: var(--orange); } .b-type { background: #B5B1AA; color: var(--texte); } .b-stats { background: #1A1A1A; }
.outils { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.outils.entre { justify-content: space-between; }

/* recherche */
.recherche { display: flex; align-items: center; gap: 10px; }
.recherche-champ { flex: 1; position: relative; }
.recherche-champ svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2.2; }
.recherche input { width: 100%; border: 0; border-radius: 999px; background: var(--doux); padding: 10px 16px 10px 38px; font-size: 13px; outline: none; }
.recherche input::placeholder { color: var(--muted); }
.recherche input:focus { box-shadow: 0 0 0 3px var(--accent-dim); }
.recherche-res { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }

/* tableaux : une ligne par projet ; Type et N° POI sur deux lignes (Racco D2 / Anticipation) */
.tableau { overflow-x: auto; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 9px 10px; white-space: nowrap;
  cursor: pointer; user-select: none; background: var(--peche); color: var(--peche-ink); position: sticky; top: 0; }
th:hover { color: var(--orange-fonce); }
th .fl { display: inline-block; width: 12px; color: var(--orange); }
td { padding: 12px 10px; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
tbody tr { cursor: pointer; background: #fff; transition: background .12s; }
tbody tr:nth-child(even) { background: #FAF8F5; }   /* une ligne sur deux légèrement grisée pour se repérer */
tbody tr:hover { background: #FFF4EA; }
tbody tr:last-child td { border-bottom: 0; }
.sous { display: block; line-height: 1.9; white-space: nowrap; }
.type-dossier { font-weight: 700; }
.statut { color: var(--rouge); font-weight: 700; }
.feu { width: 12px; height: 12px; border-radius: 50%; display: inline-block; vertical-align: middle; }
.feu.rouge { background: #C0392B; } .feu.orange { background: #E8701A; } .feu.vert { background: #3E9B5F; } .feu.aucun { background: #D8D4CD; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* bulle de la note entière, au survol de la case Note */
.bulle-note { position: fixed; z-index: 40; max-width: 420px; max-height: 60vh; overflow: auto; padding: 10px 13px; border-radius: 10px; background: #1A1A1A; color: #f2f2f2;
  font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 10px 26px rgba(0,0,0,.2); pointer-events: none; }
.vide { padding: 26px 16px; text-align: center; color: var(--muted); font-weight: 600; cursor: default; }
.vide b { display: block; color: var(--texte); font-size: 14px; margin-bottom: 4px; }

/* feux : un clic cache ou réaffiche les dossiers de cette couleur */
.filtre-feux { display: flex; gap: 6px; }
.ff { display: flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 3px 10px; cursor: pointer; background: var(--doux-2); font-weight: 700; font-size: 11px; color: var(--texte); transition: opacity .15s; }
.ff .feu { width: 9px; height: 9px; }
.ff.zero { color: #999; }
.ff.off { opacity: .4; text-decoration: line-through; }

/* suivi par type de dossier : un onglet par type (nombre de projets en cours, archivés, annulés), puis En cours / Archivés-annulés */
.onglets { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.onglet { border: 0; border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; background: var(--doux-3); color: var(--texte); display: grid; gap: 3px; transition: background .12s; }
.onglet b { font-size: 13px; font-weight: 700; }
.onglet small { font-size: 11px; color: #666; }
.onglet small strong { color: var(--orange); }
.onglet:hover { background: var(--doux-2); }
.onglet.actif { background: var(--peche); box-shadow: inset 0 0 0 2px var(--orange); }
.choix-type { font-size: 12px; color: var(--muted); }
.ligne-sous { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sous-onglets { display: flex; gap: 6px; }
.sous-onglet { border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 12px; cursor: pointer; background: var(--doux-2); color: var(--texte); }
.sous-onglet.actif { background: var(--orange); color: #fff; }

/* statistiques */
.periode { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.date-champ { position: relative; }
.date-champ input:not(.date-cachee) { width: 118px; border: 0; border-radius: 6px; background: var(--doux-2); padding: 4px 28px 4px 8px; outline: none; font-size: 12px; font-variant-numeric: tabular-nums; }
.date-champ input::placeholder { color: #888; }
.date-champ input:focus { box-shadow: 0 0 0 2px var(--accent-dim); }
.date-champ input.invalide { box-shadow: 0 0 0 2px var(--rouge); }
.cal { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border: 0; border-radius: 5px; background: none; padding: 0; cursor: pointer; color: #888; }
.cal svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
.date-cachee { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; font-size: 13px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--doux-2); }
.stat h3 { margin: 0; font-size: 13px; font-weight: 700; }
.stat .ligne { display: flex; justify-content: space-between; align-items: baseline; }
.stat .ligne b { font-size: 16px; font-variant-numeric: tabular-nums; }
.stat.cours { background: var(--peche); } .stat.cours b { color: var(--orange); }
.stat.annul { background: #E3DFD8; }
.stat.total { background: #3A3836; color: #fff; } .stat.total b { color: #F5A66B; }
@media (max-width: 700px) { .page { padding: 16px; } header.top { border-radius: 22px; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Suivi des dossiers</h1>
    <div class="actions">
      <button class="btn btn-accent" id="nouveau" type="button" aria-haspopup="true" aria-expanded="false">+ Nouveau projet</button>
      <div class="menu" id="menuTypes" hidden role="menu"></div>
      <button class="btn" id="exporter" type="button" title="Enregistrer tous les projets dans un fichier">Exporter</button>
      <label class="btn" for="importFichier" title="Remplacer les données par une sauvegarde">Importer</label>
      <input type="file" id="importFichier" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="card">
    <div class="bandeau b-rech">Recherche</div>
    <div class="recherche">
      <div class="recherche-champ"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="recherche" type="search" placeholder="Rechercher dans tous les projets : adresse, N° POI, commentaire, note…" autocomplete="off" aria-label="Rechercher"></div>
      <span class="recherche-res" id="rechercheRes"></span>
    </div>
    <div class="tableau" id="tableauRech" hidden><table><thead id="teteRech"></thead><tbody id="corpsRech"></tbody></table></div>
  </div>

  <div class="card">
    <div class="bandeau b-cours" id="titreVue">Dossiers en cours</div>
    <div class="outils"><button class="btn btn-mini" id="retourEnCours" type="button" hidden>← Dossiers en cours</button>
      <div class="filtre-feux" id="feuxTous" role="group" aria-label="Afficher ou cacher les dossiers par feu"></div></div>
    <div class="tableau"><table><thead id="tete"></thead><tbody id="corps"></tbody></table></div>
  </div>

  <div class="card">
    <div class="bandeau b-type">Suivi par type de dossier</div>
    <div class="onglets" id="ongletsTypes" role="tablist" aria-label="Types de dossier"></div>
    <div class="ligne-sous" id="ligneSous"><div class="sous-onglets" id="sousOnglets" role="tablist" aria-label="En cours ou archivés"></div>
      <div class="filtre-feux" id="feuxType" role="group" aria-label="Afficher ou cacher les dossiers par feu"></div></div>
    <div class="choix-type" id="choixType">Clique sur un type de dossier pour voir ses projets.</div>
    <div class="tableau" id="tableauType"><table><thead id="teteType"></thead><tbody id="corpsType"></tbody></table></div>
  </div>

  <div class="card">
    <div class="bandeau b-stats">Statistiques</div>
    <div class="outils entre">
      <div class="periode">du <span class="date-champ"><input id="du" placeholder="JJ/MM/AAAA" inputmode="numeric" maxlength="10" autocomplete="off" aria-label="Date de début"><button class="cal" type="button" data-cal="du" aria-label="Calendrier"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button><input type="date" class="date-cachee" data-pick="du" tabindex="-1" aria-hidden="true"></span>
        au <span class="date-champ"><input id="au" placeholder="JJ/MM/AAAA" inputmode="numeric" maxlength="10" autocomplete="off" aria-label="Date de fin"><button class="cal" type="button" data-cal="au" aria-label="Calendrier"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button><input type="date" class="date-cachee" data-pick="au" tabindex="-1" aria-hidden="true"></span></div>
      <button class="btn btn-mini" id="voirArchives" type="button">Voir les archivés / annulés</button></div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="bulle-note" id="bulleNote" hidden></div>
<script type="module">
/* ═══ Mémoire commune à toutes les pages (IndexedDB « kultivaprix ») ═══
   projets : [{ id, type, cree }] ; p:<id>:resume : résumé écrit par la page du type de dossier ; commun:* : liens Modop et mise en page */
const $ = id => document.getElementById(id);
const base = await new Promise((ok, ko) => { const r = indexedDB.open("kultivaprix", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const kvGet = k => new Promise((ok, ko) => { const r = base.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const kvPut = (k, v) => new Promise((ok, ko) => { const t = base.transaction("kv", "readwrite"); if (v === undefined) t.objectStore("kv").delete(k); else t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); });
const kvTout = () => new Promise((ok, ko) => { const o = {}, r = base.transaction("kv").objectStore("kv").openCursor();
  r.onsuccess = () => { const c = r.result; if (c) { o[c.key] = c.value; c.continue(); } else ok(o); }; r.onerror = () => ko(r.error); });

// les 5 types de dossier (ceux qui ont une page sont actifs dans « + Nouveau projet »)
const TYPES = [
  { id: "racco-d2", nom: "Racco D2", page: "racco-d2.html" },
  { id: "loc-par", nom: "Localisation de PAR", page: "localisation-par.html" },
  { id: "crea-par", nom: "Création du PAR", page: "creation-par.html" },
  { id: "pim", nom: "PIM (Petite opération immobilière)" },
  { id: "echec-prod", nom: "Échec de prod" }];
const typeDe = id => TYPES.find(t => t.id === id) || { id, nom: id };

/* reprise des anciennes données (un seul dossier Racco D2, avant le suivi) : elles deviennent le projet n°1 */
async function reprendreAnciennes() {
  let ancien = null; try { ancien = localStorage.getItem("racco-d2-v1"); } catch (e) {}
  if (!ancien) { await kvPut("projets", []); return false; }
  let e = {}; try { e = JSON.parse(ancien) || {}; } catch (err) {}
  const propres = {}, partages = {};
  Object.entries(e.liens || {}).forEach(([k, v]) => { (["docsPOI", "notes"].includes(k) ? propres : partages)[k] = v; });
  const fermes = e.fermes || {}; e.liens = propres; delete e.fermes;
  await kvPut("p:p1:racco-d2-v1", JSON.stringify(e));
  for (const k of ["racco-d2-captures", "racco-d2-notes-captures", "racco-d2-notes-fichiers", "racco-d2-notes-images"]) {
    let v = null; try { v = localStorage.getItem(k); } catch (err) {}
    if (v != null) await kvPut("p:p1:" + k, v);
  }
  await kvPut("commun:liens", JSON.stringify(partages));
  await kvPut("commun:fermes", JSON.stringify(fermes));
  await kvPut("projets", [{ id: "p1", type: "racco-d2", cree: Date.now() }]);
  return true;
}
if ((await kvGet("projets")) === undefined && await reprendreAnciennes()) {
  location.replace("racco-d2.html?p=p1&retour=1");   // la page Racco D2 écrit le résumé du projet puis revient ici
  await new Promise(() => {});
}

/* ═══ Données affichées ═══ */
let projets = [], resumes = {};
async function charger() {
  projets = (await kvGet("projets")) || [];
  resumes = {};
  for (const p of projets) { try { resumes[p.id] = JSON.parse((await kvGet(`p:${p.id}:resume`)) || "null"); } catch (e) { resumes[p.id] = null; } }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isoVersFr = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
const frVersIso = fr => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(fr || ""); if (!m) return null; const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const formaterDate = v => { const ch = v.replace(/\D/g, "").slice(0, 8); return ch.length > 4 ? `${ch.slice(0, 2)}/${ch.slice(2, 4)}/${ch.slice(4)}` : ch.length > 2 ? `${ch.slice(0, 2)}/${ch.slice(2)}` : ch; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const ORDRE_FEU = { rouge: 0, orange: 1, vert: 2 };

// un projet = une ligne ; ses POI : la principale (Racco D2) et les autres si leur numéro est rempli
function ligneProjet(p) {
  const r = resumes[p.id] || {}, t = typeDe(p.type);
  const pois = (r.pois && r.pois.length ? r.pois : [{ type: t.nom, num: "", principale: true, statut: "en cours" }])
    .filter(x => x.principale || (x.num || "").trim());
  return { id: p.id, type: p.type, page: t.page, r, pois, principale: pois.find(x => x.principale) || pois[0] };
}
const enCours = x => !x.statut || x.statut === "en cours";

/* ═══ Tableau : tri par feu au départ, puis par n'importe quelle colonne (un 2e clic inverse) ═══ */
const COLS = [
  { k: "feu", lib: "Feu", val: L => ORDRE_FEU[L.r.urgence] ?? 9 },
  { k: "type", lib: "Type", val: L => norm(L.pois.map(x => x.type).join(" ")) },
  { k: "poi", lib: "N° POI", val: L => norm(L.pois[0]?.num) },
  { k: "cab", lib: "Cabinet conseil", val: L => norm(L.r.cabinet) },
  { k: "adr", lib: "Adresse", val: L => norm(L.r.adresse) },
  { k: "el", lib: "Nb EL", val: L => L.r.el === "" || L.r.el == null ? "" : +L.r.el },
  { k: "dlpi", lib: "DLPI", val: L => L.r.dlpi || "" },
  { k: "dre", lib: "DRE", val: L => L.r.dre || "" },
  { k: "dlr", lib: "DLR", val: L => L.r.dlr || "" },
  { k: "note", lib: "Note", val: L => norm(L.r.note) }];
// deux tableaux : celui du haut (tous les types) et celui de l'onglet du type choisi ; chacun garde son tri et sa vue
const TABLEAUX = {
  tous: { tete: "tete", corps: "corps", tri: { k: "feu", sens: 1 }, vue: "cours", type: null },
  type: { tete: "teteType", corps: "corpsType", tri: { k: "feu", sens: 1 }, vue: "cours", type: null },   // aucun type choisi au départ
  rech: { tete: "teteRech", corps: "corpsRech", tri: { k: "feu", sens: 1 }, vue: "tous", type: null } };
// feux affichés dans « Dossiers en cours » et dans le tableau du type (rouge, orange, vert, sans feu)
const FEUX = [["rouge", "Urgent"], ["orange", "Pas urgent, je peux avancer"], ["vert", "En attente de documents"], ["aucun", "Sans feu"]];
TABLEAUX.tous.feux = { rouge: true, orange: true, vert: true, aucun: true }; TABLEAUX.tous.barre = "feuxTous";
TABLEAUX.type.feux = { rouge: true, orange: true, vert: true, aucun: true }; TABLEAUX.type.barre = "feuxType";
try { const f = JSON.parse(localStorage.getItem("kultivaprix-suivi-feux") || "{}"); ["tous", "type"].forEach(t => Object.assign(TABLEAUX[t].feux, f[t] || {})); } catch (e) {}
const garderFeux = () => { try { localStorage.setItem("kultivaprix-suivi-feux", JSON.stringify({ tous: TABLEAUX.tous.feux, type: TABLEAUX.type.feux })); } catch (e) {} };
const couleur = x => x.r.urgence || "aucun";
let trouves = new Map();   // projet → où le mot a été trouvé
try { const o = JSON.parse(localStorage.getItem("kultivaprix-suivi-onglet") || "{}"); if (TYPES.some(t => t.id === o.type)) TABLEAUX.type.type = o.type; if (o.vue === "archives") TABLEAUX.type.vue = "archives"; } catch (e) {}
const garderOnglet = () => { try { localStorage.setItem("kultivaprix-suivi-onglet", JSON.stringify({ type: TABLEAUX.type.type, vue: TABLEAUX.type.vue })); } catch (e) {} };
const comparer = tri => (a, b) => {
  const c = COLS.find(x => x.k === tri.k), va = c.val(a), vb = c.val(b);
  const videA = va === "" || va == null, videB = vb === "" || vb == null;
  if (videA !== videB) return videA ? 1 : -1;   // les cases vides toujours en bas
  if (!videA && va !== vb) return (va < vb ? -1 : 1) * tri.sens;
  // à égalité : la DRE la plus proche, puis l'adresse
  return (a.r.dre || "9999").localeCompare(b.r.dre || "9999") || norm(a.r.adresse).localeCompare(norm(b.r.adresse));
};
// en cours : les projets dont la POI principale est en cours ; archivés / annulés : seulement les POI qui le sont
function lignesVue(vue, type) {
  if (vue === "tous") return projets.filter(p => trouves.has(p.id)).map(ligneProjet);   // résultats de la recherche : toutes leurs POI
  const L = projets.filter(p => !type || p.type === type).map(ligneProjet);
  if (vue === "cours") return L.filter(x => enCours(x.principale));
  return L.map(x => ({ ...x, pois: x.pois.filter(po => !enCours(po)) })).filter(x => x.pois.length);
}
function remplirTableau(T) {
  const { tri, vue, type } = T;
  $(T.tete).innerHTML = `<tr>${COLS.map(c => `<th data-tri="${c.k}" aria-sort="${tri.k === c.k ? (tri.sens > 0 ? "ascending" : "descending") : "none"}">${esc(c.lib)} <span class="fl">${tri.k === c.k ? (tri.sens > 0 ? "▲" : "▼") : ""}</span></th>`).join("")}</tr>`;
  let L = lignesVue(vue, type).sort(comparer(tri));
  if (T.feux) {
    const n = { rouge: 0, orange: 0, vert: 0, aucun: 0 }; L.forEach(x => n[couleur(x)]++);
    $(T.barre).innerHTML = FEUX.map(([k, l]) => `<button class="ff${T.feux[k] ? "" : " off"}${n[k] ? "" : " zero"}" type="button" data-ff="${k}" aria-pressed="${T.feux[k]}" title="${T.feux[k] ? "Cacher" : "Afficher"} : ${l}"><span class="feu ${k}"></span>${n[k]}</button>`).join("");
    const caches = L.filter(x => !T.feux[couleur(x)]).length;
    L = L.filter(x => T.feux[couleur(x)]);
    if (!L.length && caches) { $(T.corps).innerHTML = `<tr><td colspan="${COLS.length}" class="vide"><b>Tous les dossiers sont cachés</b>Clique sur un feu pour les réafficher.</td></tr>`; return; }
  }
  if (!L.length) {
    const nb = projets.filter(p => !type || p.type === type).length;
    $(T.corps).innerHTML = `<tr><td colspan="${COLS.length}" class="vide">${vue === "cours"
      ? (nb ? "<b>Aucun dossier en cours</b>Ils sont tous archivés ou annulés." : type ? `<b>Aucun projet ${esc(typeDe(type).nom)}</b>${typeDe(type).page ? "Crée-le avec « + Nouveau projet » en haut à droite." : "Ce type de dossier arrive bientôt."}` : "<b>Crée ton premier projet</b>Clique sur « + Nouveau projet » en haut à droite.")
      : "<b>Aucun dossier archivé ou annulé</b>Ils apparaîtront ici dès qu'une POI sera archivée ou annulée."}</td></tr>`;
    return;
  }
  $(T.corps).innerHTML = L.map(x => {
    const r = x.r, statut = po => enCours(po) ? "" : ` <span class="statut">${esc(po.statut)}${po.date && vue !== "cours" ? " le " + isoVersFr(po.date) : ""}</span>`;
    return `<tr data-projet="${x.id}" tabindex="0" title="Ouvrir ce projet">
      <td><span class="feu ${r.urgence || "aucun"}" title="${esc(r.urgence ? { rouge: "Urgent", orange: "Pas urgent, je peux avancer", vert: "En attente de documents" }[r.urgence] : "Pas de feu")}"></span></td>
      <td class="type-dossier">${x.pois.map(po => `<span class="sous">${esc(po.type)}</span>`).join("")}</td>
      <td>${x.pois.map(po => `<span class="sous num">${esc(po.num || "—")}${statut(po)}</span>`).join("")}</td>
      <td>${esc(r.cabinet)}</td><td>${esc(r.adresse)}</td><td class="num">${esc(r.el)}</td>
      <td class="num">${isoVersFr(r.dlpi)}</td><td class="num">${isoVersFr(r.dre)}</td><td class="num">${isoVersFr(r.dlr)}</td>
      <td class="note" data-note="${x.id}">${esc(r.note)}</td></tr>`; }).join("");
}
// statut d'un projet = celui de sa POI principale
const statutProjet = p => { const s = ligneProjet(p).principale?.statut; return s === "archivée" ? "arch" : s === "annulée" ? "annul" : "cours"; };
function rendreTableau() {
  const T = TABLEAUX.tous;
  $("titreVue").textContent = T.vue === "cours" ? "Dossiers en cours" : "Dossiers archivés et annulés";
  $("retourEnCours").hidden = T.vue === "cours";
  $("voirArchives").hidden = T.vue !== "cours";
  remplirTableau(T);
  // onglets par type : nombre de projets en cours, archivés et annulés
  const U = TABLEAUX.type;
  $("ongletsTypes").innerHTML = TYPES.map(t => {
    const n = { cours: 0, arch: 0, annul: 0 }; projets.filter(p => p.type === t.id).forEach(p => n[statutProjet(p)]++);
    return `<button class="onglet${t.id === U.type ? " actif" : ""}" type="button" role="tab" aria-selected="${t.id === U.type}" data-onglet="${t.id}">` +
      `<b>${esc(t.nom)}</b><small>${n.cours ? `<strong>${n.cours} en cours</strong>` : "0 en cours"} · ${n.arch} archivé${n.arch > 1 ? "s" : ""} · ${n.annul} annulé${n.annul > 1 ? "s" : ""}</small></button>`; }).join("");
  const nb = v => lignesVue(v, U.type).length;
  $("sousOnglets").innerHTML = [["cours", "En cours"], ["archives", "Archivés / annulés"]].map(([v, l]) =>
    `<button class="sous-onglet${U.vue === v ? " actif" : ""}" type="button" role="tab" aria-selected="${U.vue === v}" data-sousonglet="${v}">${l} (${nb(v)})</button>`).join("");
  // aucun type choisi : ni sous-onglets ni tableau
  $("ligneSous").hidden = $("tableauType").hidden = !U.type;
  $("choixType").hidden = !!U.type;
  if (U.type) remplirTableau(U); else $("corpsType").innerHTML = "";
  rendreRecherche();
}
document.addEventListener("click", e => {
  const th = e.target.closest("thead [data-tri]");
  if (th) { const T = th.closest("#teteType") ? TABLEAUX.type : th.closest("#teteRech") ? TABLEAUX.rech : TABLEAUX.tous;
    T.tri = T.tri.k === th.dataset.tri ? { k: T.tri.k, sens: -T.tri.sens } : { k: th.dataset.tri, sens: 1 }; rendreTableau(); return; }
  const ff = e.target.closest("[data-ff]");
  if (ff) { const T = ff.closest("#feuxType") ? TABLEAUX.type : TABLEAUX.tous; T.feux[ff.dataset.ff] = !T.feux[ff.dataset.ff]; garderFeux(); rendreTableau(); return; }
  const o = e.target.closest("[data-onglet]"); if (o) { TABLEAUX.type.type = o.dataset.onglet; garderOnglet(); rendreTableau(); return; }
  // clic ailleurs (hors des onglets, des sous-onglets et du tableau du type) : plus aucun type choisi
  if (TABLEAUX.type.type && !e.target.closest("#ongletsTypes, #ligneSous, #tableauType")) { TABLEAUX.type.type = null; garderOnglet(); rendreTableau(); }
  const so = e.target.closest("[data-sousonglet]"); if (so) { TABLEAUX.type.vue = so.dataset.sousonglet; garderOnglet(); rendreTableau(); return; }
  const tr = e.target.closest("tbody [data-projet]"); if (tr) ouvrir(tr);
});
const ouvrir = tr => { const p = projets.find(x => x.id === tr.dataset.projet), t = p && typeDe(p.type); if (t?.page) location.href = `${t.page}?p=${encodeURIComponent(p.id)}`; };
// note entière au survol de sa case (avec ses retours à la ligne)
document.addEventListener("mouseover", e => {
  const b = $("bulleNote"), td = e.target.closest?.("td[data-note]");
  const r = td && resumes[td.dataset.note], t = r && (r.noteLignes || r.note);
  if (!t) { b.hidden = true; return; }
  b.textContent = t; b.hidden = false;
  const c = td.getBoundingClientRect(), w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = Math.max(8, Math.min(c.right - w, innerWidth - w - 8)) + "px";
  b.style.top = (c.bottom + 6 + h > innerHeight ? Math.max(8, c.top - h - 6) : c.bottom + 6) + "px";
});
addEventListener("scroll", () => { $("bulleNote").hidden = true; }, true);
document.addEventListener("keydown", e => { const tr = e.target.closest?.("tbody [data-projet]"); if (tr && e.key === "Enter") ouvrir(tr); });
$("voirArchives").onclick = () => { TABLEAUX.tous.vue = "archives"; rendreTableau(); $("titreVue").scrollIntoView({ behavior: "smooth", block: "start" }); };
$("retourEnCours").onclick = () => { TABLEAUX.tous.vue = "cours"; rendreTableau(); };

/* ═══ Recherche : cherche dans tout le contenu de chaque projet et surligne les lignes trouvées ═══ */
function rendreRecherche() {
  const q = norm($("recherche").value.trim());
  trouves = new Map();
  if (q.length >= 2) projets.forEach(p => {
    const r = resumes[p.id] || {};
    const sources = [...(r.recherche || []), ...(r.pois || []).map(po => ({ lieu: "Type", texte: po.type })), { lieu: "Type", texte: typeDe(p.type).nom }];
    const lieux = [...new Set(sources.filter(x => norm(x.texte).includes(q)).map(x => x.lieu))];
    if (lieux.length) trouves.set(p.id, lieux);
  });
  const n = trouves.size;
  $("rechercheRes").textContent = q.length >= 2 ? (n ? `${n} projet${n > 1 ? "s" : ""} trouvé${n > 1 ? "s" : ""}` : "Aucun projet trouvé") : "";
  $("tableauRech").hidden = q.length < 2;
  if (q.length < 2) { $("corpsRech").innerHTML = ""; return; }
  remplirTableau(TABLEAUX.rech);
  if (!n) $("corpsRech").innerHTML = `<tr><td colspan="${COLS.length}" class="vide"><b>Aucun projet trouvé</b>Essaie un autre mot-clé.</td></tr>`;
  // au survol d'une ligne : où le mot a été trouvé
  $("corpsRech").querySelectorAll("tr[data-projet]").forEach(tr => { tr.title = `Trouvé dans : ${trouves.get(tr.dataset.projet).join(", ")}`; });
}
$("recherche").addEventListener("input", rendreRecherche);

/* ═══ Statistiques : nombre de POI et d'EL ; les EL sont liés au projet (comptés avec sa POI principale) ═══
   période du … au … : en cours = reçue avant la fin et pas encore archivée/annulée à la fin ; archivés / annulés = pendant la période */
function categorie(po, recu, d1, d2) {
  if (enCours(po)) return !d2 || !recu || recu <= d2 ? "cours" : null;
  const cat = po.statut === "annulée" ? "annul" : "arch", dt = po.date || "";
  if (!d1 && !d2) return cat;
  if (dt && (!d1 || dt >= d1) && (!d2 || dt <= d2)) return cat;
  if (dt && d2 && dt > d2 && (!recu || recu <= d2)) return "cours";   // archivée après la période : encore en cours pendant
  return null;
}
function rendreStats() {
  const d1 = frVersIso($("du").value) || "", d2 = frVersIso($("au").value) || "";
  const S = { cours: { poi: 0, el: 0 }, arch: { poi: 0, el: 0 }, annul: { poi: 0, el: 0 } };
  projets.map(ligneProjet).forEach(x => x.pois.forEach(po => {
    const c = categorie(po, x.r.recu || "", d1, d2); if (!c) return;
    S[c].poi++; if (po.principale) S[c].el += parseInt(x.r.el, 10) || 0;
  }));
  const T = { poi: S.cours.poi + S.arch.poi + S.annul.poi, el: S.cours.el + S.arch.el + S.annul.el };
  const bloc = (cls, titre, o) => `<div class="stat ${cls}"><h3>${titre}</h3><div class="ligne"><span>Nombre de POI</span><b>${o.poi}</b></div><div class="ligne"><span>Nombre d'EL</span><b>${o.el}</b></div></div>`;
  $("stats").innerHTML = bloc("cours", "En cours", S.cours) + bloc("arch", "Archivés", S.arch) + bloc("annul", "Annulés", S.annul) + bloc("total", "Total", T);
}
// période gardée d'une visite à l'autre sur ce navigateur
try { const p = JSON.parse(localStorage.getItem("kultivaprix-suivi-periode") || "{}"); $("du").value = p.du || ""; $("au").value = p.au || ""; } catch (e) {}
const garderPeriode = () => { try { localStorage.setItem("kultivaprix-suivi-periode", JSON.stringify({ du: $("du").value, au: $("au").value })); } catch (e) {} };
["du", "au"].forEach(id => {
  const c = $(id);
  c.addEventListener("input", () => { c.value = formaterDate(c.value); c.classList.toggle("invalide", c.value.length === 10 && !frVersIso(c.value)); if (!c.value || frVersIso(c.value)) { garderPeriode(); rendreStats(); } });
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cal]"); if (!b) return;
  const pick = document.querySelector(`[data-pick="${b.dataset.cal}"]`);
  pick.value = frVersIso($(b.dataset.cal).value) || new Date().toISOString().slice(0, 10);
  try { pick.showPicker(); } catch (err) { pick.focus(); pick.click(); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset?.pick; if (!k || !e.target.value) return;
  $(k).value = isoVersFr(e.target.value); $(k).classList.remove("invalide"); garderPeriode(); rendreStats();
});

/* ═══ Nouveau projet : choix du type ═══ */
$("menuTypes").innerHTML = TYPES.map(t => `<button type="button" role="menuitem" data-type="${t.id}"${t.page ? "" : " disabled"}>${esc(t.nom)}${t.page ? "" : "<small>à venir</small>"}</button>`).join("");
$("nouveau").onclick = () => { const m = $("menuTypes"); m.hidden = !m.hidden; $("nouveau").setAttribute("aria-expanded", String(!m.hidden)); };
document.addEventListener("pointerdown", e => { if (!e.target.closest("#menuTypes, #nouveau")) { $("menuTypes").hidden = true; $("nouveau").setAttribute("aria-expanded", "false"); } });
$("menuTypes").addEventListener("click", async e => {
  const b = e.target.closest("[data-type]"); if (!b || b.disabled) return;
  const t = typeDe(b.dataset.type), id = "p" + Date.now().toString(36);
  const L = (await kvGet("projets")) || [];
  L.push({ id, type: t.id, cree: Date.now() });
  await kvPut("projets", L);
  location.href = `${t.page}?p=${id}`;
});

/* ═══ Sauvegarde : tous les projets (et les captures des fenêtres ComL) dans un fichier ═══ */
const BASES_COML = ["racco-d2-coml", "loc-par-coml", "crea-par-coml"];   // une base de captures ComL par type de dossier
const baseComl = nom => new Promise((ok, ko) => { const r = indexedDB.open(nom, 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const comlTout = db => new Promise((ok, ko) => { const o = {}, r = db.transaction("photos").objectStore("photos").openCursor();
  r.onsuccess = () => { const c = r.result; if (c) { o[c.key] = c.value; c.continue(); } else ok(o); }; r.onerror = () => ko(r.error); });
$("exporter").onclick = async () => {
  const coml = {}; for (const nom of BASES_COML) coml[nom] = await comlTout(await baseComl(nom));
  const donnees = { app: "kultivaprix", version: 2, date: new Date().toISOString(), kv: await kvTout(), coml };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(donnees)], { type: "application/json" }));
  a.download = `suivi-dossiers-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("importFichier").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (err) { alert("Ce fichier n'est pas une sauvegarde valable."); return; }
  if (!d || d.app !== "kultivaprix" || !d.kv) { alert("Ce fichier n'est pas une sauvegarde du suivi des dossiers."); return; }
  if (!confirm(`Remplacer toutes les données actuelles par la sauvegarde du ${new Date(d.date).toLocaleDateString("fr-FR")} ?`)) return;
  await new Promise((ok, ko) => { const t = base.transaction("kv", "readwrite"), st = t.objectStore("kv"); st.clear(); Object.entries(d.kv).forEach(([k, v]) => st.put(v, k)); t.oncomplete = ok; t.onerror = () => ko(t.error); });
  // version 1 : seulement les captures Racco D2
  const parBase = d.version >= 2 ? (d.coml || {}) : { "racco-d2-coml": d.coml || {} };
  for (const nom of BASES_COML) {
    const db = await baseComl(nom);
    await new Promise((ok, ko) => { const t = db.transaction("photos", "readwrite"), st = t.objectStore("photos"); st.clear(); Object.entries(parBase[nom] || {}).forEach(([k, v]) => st.put(v, k)); t.oncomplete = ok; t.onerror = () => ko(t.error); });
  }
  location.reload();
});

async function tout() { await charger(); rendreTableau(); rendreStats(); }
await tout();
// retour sur la page par « Précédent » : les infos des projets ont pu changer
addEventListener("pageshow", e => { if (e.persisted) tout(); });
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racco D2</title>
<style>
[hidden] { display: none !important; }
/* Mise en page : écran coupé en deux — questionnaire à gauche, fiche + situation + calculette à droite. Thème « Clay » clair du dashboard. */
:root {
  --fond: #efe3d6; --side: #cfe2d8; --side-text: #3f5a4c;
  --carte: #fffaf4; --carte-2: #f3e7db; --corail: #f4c6b5;
  --texte: #4a4238; --muted: #6d6259; --ligne: rgba(74, 66, 56, .1);
  --peach: #f6d5c9; --sun: #f9e9b8; --sky: #cfdcef; --mint: #d8e9dc;
  --peach-ink: #b5563a; --sun-ink: #8a6410;  --sky-ink: #395884; --mint-ink: #2f6b4a;
  --accent: #e8907a; --accent-fort: #f0a48f; --accent-ink: #33190f; --accent-dim: rgba(232, 144, 122, .28);
  --led-vert: #36c26a; --led-rouge: #e2493a; --ok: #3d7f55; --ok-tint: #d9ead9; --ko: #c1523f; --ko-tint: #f6d5c9;
  --run: #96660f; --run-tint: #f9e9b8; --none: #7d7670; --none-tint: #ebe4dc;
  --clay: inset 2px 2px 5px rgba(255,255,255,.9), inset -3px -3px 8px rgba(120,90,60,.14), 0 10px 22px rgba(120,90,60,.16);
  --clay-sm: inset 1px 1px 3px rgba(255,255,255,.95), inset -2px -2px 5px rgba(120,90,60,.14), 0 5px 12px rgba(120,90,60,.16);
  --inset: inset 2px 2px 6px rgba(120,90,60,.12), inset -1px -1px 3px rgba(255,255,255,.6);
  --pouss: 0 5px 0 rgba(120,90,60,.22); --pouss-bas: 0 2px 0 rgba(120,90,60,.22);
  --font: -apple-system, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; font-size: inherit; color: inherit; }

.page { max-width: 1500px; margin: 0 auto; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 18px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--side); color: var(--side-text); border-radius: var(--r-xl); padding: 14px 22px; box-shadow: var(--clay-sm); }
header.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .02em; }
header.top .sous { font-size: 13px; opacity: .85; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 0; border-radius: var(--r-md); padding: 10px 16px; font-weight: 800; font-size: 13.5px; cursor: pointer;
  background: var(--carte-2); box-shadow: var(--clay-sm); transition: transform .18s var(--bounce); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn-accent { background: var(--accent); color: var(--accent-ink); box-shadow: var(--pouss); }
.btn-accent:active { transform: translateY(3px); box-shadow: var(--pouss-bas); }
.btn:focus-visible, .chev:focus-visible, .etape:focus-visible { outline: none; box-shadow: var(--clay-sm), 0 0 0 3px var(--accent-dim); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.card { background: var(--carte); border-radius: var(--r-lg); box-shadow: var(--clay); padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ── Questionnaire ── */
.gt { border-radius: var(--r-md); background: var(--carte-2); box-shadow: var(--inset); padding: 4px 8px 6px; }
.gt + .gt { margin-top: 10px; }
.gt.actif { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
.gt.verrou .ligne.d1 { opacity: .5; }
.cb:disabled { cursor: not-allowed; }
.cb:disabled + .lib { cursor: default; }
.ligne { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 10px; min-height: 40px; }
.ligne.d1 { font-weight: 800; font-size: 16px; }
.ligne.d2 { padding-left: 38px; font-weight: 700; }
.ligne.d3 { padding-left: 70px; }
.ligne.d4 { padding-left: 102px; }
.ligne.d5 { padding-left: 134px; }
.ligne .lib { flex: 1; min-width: 0; cursor: pointer; }
.ligne.valide .lib { color: var(--ok); }
.num { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-right: 4px; }
.chev { border: 0; background: var(--carte); box-shadow: var(--clay-sm); width: 30px; height: 30px; border-radius: 10px; cursor: pointer; flex: none;
  display: grid; place-items: center; transition: transform .2s var(--bounce); font-size: 12px; }
.gt.ferme .chev { transform: rotate(-90deg); }
.chev.vide { background: none; box-shadow: none; cursor: default; }
.gt.ferme .enfants { display: none; }
.enfants { border-left: 2px dashed var(--ligne); margin-left: 18px; }
.cb { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; margin: 0; border-radius: 8px; cursor: pointer;
  background: var(--carte); box-shadow: var(--inset); display: grid; place-items: center; transition: background .2s; }
.cb::after { content: ""; width: 7px; height: 12px; border: solid var(--carte); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.cb:checked { background: var(--ok); box-shadow: var(--clay-sm); }
.cb:checked::after { opacity: 1; }
.cb.auto:checked { background: var(--mint-ink); }
.cb:focus-visible { outline: none; box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.tag { font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tag.ok { background: var(--ok-tint); color: var(--ok); }
.tag.run { background: var(--run-tint); color: var(--run); }
.tag.ko { background: var(--ko-tint); color: var(--ko); }
.tag.none { background: var(--none-tint); color: var(--none); }
.led { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-right: 6px; }
.led.on { background: radial-gradient(circle at 35% 35%, #c9f5d8 0 18%, var(--led-vert) 45%); box-shadow: 0 0 0 2px rgba(54,194,106,.18), 0 0 8px rgba(54,194,106,.75); }
.led.off { background: radial-gradient(circle at 35% 35%, #ffd2cb 0 18%, var(--led-rouge) 45%); box-shadow: 0 0 0 2px rgba(226,73,58,.16), 0 0 8px rgba(226,73,58,.6); }
.ou { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 0 0 0 38px; }

/* ── Fiche dossier ── */
.card.dossier { padding: 14px 16px; }
.card.dossier h2 { margin-bottom: 10px; }
.fiche { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.champ { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.champ.large { grid-column: 1 / -1; }
.champ label { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.champ input { width: 100%; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 6px 10px; font-size: 14px; outline: none; min-height: 32px; }
.champ input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.champ input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; text-align: left; }
.champ input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.champ input::placeholder { color: var(--muted); opacity: .7; }
/* DLPI : saisie JJ/MM/AAAA + calendrier natif caché derrière l'icône */
.date-champ, .el-champ { position: relative; }
.date-champ input:not(.date-cachee) { padding-right: 34px; font-variant-numeric: tabular-nums; }
.date-champ input.invalide { box-shadow: var(--inset), 0 0 0 2px var(--ko); }
.cal, .note-btn { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 8px; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--carte); color: var(--muted); box-shadow: var(--clay-sm); }
.cal svg, .note-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cal:hover, .note-btn:hover { color: var(--texte); }
.date-cachee { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
/* Nombre d'EL : bulle de commentaires et de captures */
.el-champ input { padding-right: 34px; }
.note-btn.plein { background: var(--accent); color: var(--accent-ink); }
.el-zone { position: relative; }
.bulle { position: absolute; z-index: 30; top: 100%; right: 0; margin-top: 6px; width: min(340px, 86vw); background: var(--carte); border-radius: var(--r-md);
  box-shadow: var(--clay), 0 0 0 1px var(--ligne); padding: 10px 12px; display: grid; gap: 8px; }
.bulle.survol { box-shadow: var(--clay), 0 0 0 2px var(--accent-dim); }
.bulle-titre { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bulle textarea { width: 100%; resize: vertical; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 7px 10px; font: inherit; font-size: 13.5px; outline: none; min-height: 64px; }
.bulle textarea:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.captures { display: flex; flex-wrap: wrap; gap: 6px; }
.captures:empty { display: none; }
.capture { position: relative; width: 72px; height: 54px; border-radius: 8px; overflow: hidden; box-shadow: var(--clay-sm); cursor: zoom-in; background: var(--carte-2); }
.capture img { width: 100%; height: 100%; object-fit: cover; display: block; }
.capture button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: 0; border-radius: 50%; padding: 0; cursor: pointer; font-size: 12px; line-height: 18px;
  background: rgba(51, 25, 15, .7); color: #fff; }
.bulle-bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bulle-aide { font-size: 11.5px; color: var(--muted); }
.bulle.depot { box-shadow: var(--clay), 0 0 0 3px var(--accent); }
.visionneuse { position: fixed; inset: 0; z-index: 100; background: rgba(40, 30, 20, .75); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.visionneuse img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
/* Regroupement syndic : référence + IMB en nombre libre, défilement horizontal */
.regroup-tete { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.regroup-tete label { flex: none; }
.regroup-tete input { width: min(220px, 55%); }
.regroup-tete .import { margin-left: auto; flex: none; }
.regroup { position: relative; }
.import-msg { font-size: 12px; font-weight: 700; color: var(--ok); margin: 2px 0 4px; }
.import-msg.ko { color: var(--ko); }
.imb-item.info input { box-shadow: var(--inset), inset 0 -2px 0 var(--accent-dim); }
.imb-item.actif input { box-shadow: var(--inset), 0 0 0 2px var(--accent-dim); }
.imb-bulle { right: auto; width: min(320px, 86vw); }
.mini-lab { font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: -4px; }
.el-trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.el-trois > div { display: grid; gap: 6px; }
.bulle input { width: 100%; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 6px 9px; font: inherit; font-size: 13.5px; outline: none; min-height: 30px; }
.bulle input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.imb-liste { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.imb-item { position: relative; flex: 0 0 calc((100% - 24px - 32px) / 4); min-width: 118px; scroll-snap-align: start; }
.imb-liste::-webkit-scrollbar { height: 6px; }
.imb-liste::-webkit-scrollbar-thumb { background: var(--ligne); border-radius: 3px; }
.imb-item input { font-family: var(--mono); font-size: 13px; }
.imb-item .suppr { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 20px; height: 20px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--none-tint); color: var(--muted); font-size: 13px; line-height: 20px; }
.imb-plus { flex: 0 0 32px; height: 32px; align-self: center; border: 0; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: 800; color: var(--accent-ink); background: var(--accent); box-shadow: var(--clay-sm); }
.imb-plus:active { transform: scale(.95); }

/* ── Situation ── */
.frise { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.etape { border: 0; cursor: pointer; border-radius: var(--r-sm); padding: 8px 4px; background: var(--none-tint); color: var(--none);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; transition: transform .18s var(--bounce); min-width: 0; }
.etape:hover { transform: translateY(-1px); }
.etape .n { font-size: 17px; font-variant-numeric: tabular-nums; }
.etape .t { font-size: 10.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.etape.ok { background: var(--ok-tint); color: var(--ok); }
.etape.run { background: var(--run-tint); color: var(--run); }
.etape.ko { background: var(--ko-tint); color: var(--ko); }
.etape.sel { box-shadow: 0 0 0 2px var(--texte); }
.situ-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.situ-tete .titre { font-size: 18px; font-weight: 800; }
.infos { display: grid; grid-template-columns: 130px minmax(0, 1fr); border-radius: var(--r-md); overflow: hidden; background: var(--carte-2); box-shadow: var(--inset); }
.infos div { padding: 10px 14px; border-bottom: 1px solid var(--ligne); min-width: 0; }
.infos div:nth-last-child(-n+2) { border-bottom: 0; }
.infos .k { font-size: 12px; font-weight: 800; color: var(--muted); }
.infos .v { font-weight: 700; }
.infos .v ul { margin: 0; padding-left: 18px; font-weight: 600; }
.global { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* ── Info ── */
.h2-droite { display: flex; align-items: center; gap: 8px; }
.card.info { background: var(--corail); }
.card.info h2 { color: var(--peach-ink); }
/* les deux écrans occupent la même case : la carte garde la taille de la Situation */
.vues { display: grid; }
.vues > .vue { grid-area: 1 / 1; min-width: 0; }
.vues > .vue.cachee { visibility: hidden; }
#vueInfo { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
#vueInfo .info-dates, #vueInfo .code-bloc { margin-bottom: 0; }
.info-dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.info-dates:last-child { margin-bottom: 0; }
.code-bloc { background: var(--carte-2); box-shadow: var(--inset); border-radius: var(--r-md); padding: 6px 12px 8px; display: grid; justify-items: center; gap: 4px; margin-bottom: 12px; text-align: center; }
.code-bloc { position: relative; }
/* codes secondaires : pastilles « nom | code », deux par ligne */
.pastilles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.pastille { position: relative; display: flex; align-items: center; min-width: 0; border-radius: 999px; background: var(--carte-2); box-shadow: var(--inset); padding: 6px 6px 6px 0; gap: 8px; }
.pastille .pl { flex: none; padding: 0 10px 0 14px; margin-right: 2px; border-right: 2px solid var(--ligne); font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.pastille output { flex: 1; min-width: 0; text-align: left; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; overflow-x: auto; user-select: all; }
/* petite icône de copie posée sur le bord haut, à droite */
.copie { position: absolute; top: -12px; right: 18px; width: 22px; height: 22px; border: 0; border-radius: 8px; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: var(--clay-sm); transition: transform .15s var(--bounce); }
.copie:hover { transform: translateY(-1px); }
.copie:active { transform: scale(.92); }
.copie:focus-visible { outline: none; box-shadow: var(--clay-sm), 0 0 0 3px var(--accent-dim); }
.copie svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.copie .ic-ok, .copie.fait .ic-copie { display: none; }
.copie.fait .ic-ok { display: block; }
.copie.fait { background: var(--ok); color: var(--carte); }
.code-bloc .copie { top: 8px; right: 10px; }
.pastille .copie { position: static; flex: none; }
.sortie .decal { justify-content: space-between; }
.sortie .copie { position: static; flex: none; width: 20px; height: 20px; }
.copie:disabled { opacity: .35; cursor: default; transform: none; }
.code-bloc label { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.code-bloc output { max-width: calc(100% - 40px); min-width: 0; border-radius: var(--r-sm); background: none; color: var(--texte); padding: 5px 12px; font-family: var(--mono); font-size: 17px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; overflow-x: auto; user-select: all; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .code-bloc output { font-size: 15px; padding: 5px 4px; max-width: 100%; white-space: normal; text-align: center; } .code-bloc label { margin-right: 28px; } }
.code-note { font-size: 12px; color: var(--muted); }
.code-note:empty { display: none; }

/* ── Calculette ── */
.calc { display: grid; gap: 10px; }
.ecran { background: var(--carte-2); box-shadow: var(--inset); border-radius: var(--r-md); padding: 10px 14px; text-align: right; font-family: var(--mono); min-width: 0; }
.ecran .expr { font-size: 13px; color: var(--muted); min-height: 20px; overflow-x: auto; white-space: nowrap; }
.ecran .res { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: right; font-family: var(--mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--texte); outline: none; min-height: 36px; }
.ecran:focus-within { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.ecran .expr { display: block; }
.btn-mini { padding: 5px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--texte); }
.calc { position: relative; }
.sorties { display: grid; gap: 8px; }
.sortie { background: var(--carte-2); box-shadow: var(--inset); border-radius: var(--r-md); padding: 8px 12px; display: grid; gap: 6px; min-width: 0; }
.decal { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 800; color: var(--muted); }
.decal .lbl { text-transform: uppercase; letter-spacing: .08em; }
.sortie .date { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cache { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }

/* ── Confirmation ── */
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
/* ── Grand écran : la colonne droite tient dans la hauteur et reste visible ── */
@media (min-width: 1150px) {
  .page { padding-block: 12px 20px; gap: 12px; }
  header.top { padding: 10px 20px; }
  .split { gap: 12px; }
  .col.droite { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start;
    max-height: calc(100vh - 24px); overflow-y: auto; }
  .col.droite .card { padding: 12px 14px; }
  .col.droite .card h2 { margin-bottom: 8px; }
  .fiche { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
  .champ.adr { grid-column: span 2; }
  .champ input { min-height: 30px; padding: 5px 9px; }
  .frise { gap: 4px; margin-bottom: 10px; }
  .etape { padding: 6px 2px; }
  .situ-tete { margin-bottom: 8px; }
  .situ-tete .titre { font-size: 16px; }
  .infos { grid-template-columns: 92px minmax(0, 1fr); font-size: 13.5px; }
  .infos div { padding: 6px 10px; }
  .global { margin-top: 8px; font-size: 12px; }
  .calc { gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sorties { display: contents; }
  .ecran, .sortie { display: flex; flex-direction: column; justify-content: center; }
  .ecran { padding: 6px 12px; }

}

@media (min-width: 1150px) and (max-height: 860px) {

}

<body>
<div class="page">
  <header class="top">
    <h1>Racco D2</h1>
  </header>

  <div class="split">
    <!-- Gauche : questionnaire -->
    <section class="col">

    <section class="col droite">

          <div class="info-dates">

          </div>
          <div class="code-bloc">
            <label for="comlab">Code Comlab</label>
            <output id="comlab" aria-live="polite"></output>
            <button class="copie" data-copie="comlab" type="button" aria-label="Copier le code Comlab" title="Copier"><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
          </div>
          <div class="pastilles">
            <div class="pastille"><span class="pl">APE</span><output id="code_ape"></output><button class="copie" data-copie="ape" type="button" aria-label="Copier le code APE" title="Copier"><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
            <div class="pastille"><span class="pl">DZI</span><output id="code_dzi"></output><button class="copie" data-copie="dzi" type="button" aria-label="Copier le code DZI" title="Copier"><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
            <div class="pastille"><span class="pl">RTY</span><output id="code_rty"></output><button class="copie" data-copie="rty" type="button" aria-label="Copier le code RTY" title="Copier"><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
            <div class="pastille"><span class="pl">LVE</span><output id="code_lve"></output><button class="copie" data-copie="lve" type="button" aria-label="Copier le code LVE" title="Copier"><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>

      <div class="card">

        <div class="calc">
          <div class="ecran"><label class="expr" for="cDate" id="cExpr">Date de départ</label><input type="date" id="cDate" class="res"></div>
          <div class="sorties">
            <div class="sortie"><div class="decal"><span class="lbl">+ 30 jours</span><button class="copie" data-copie="date" data-cible="o0r" type="button" aria-label="Copier la date + 30 jours" title="Copier" disabled><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div><div class="date" id="o0r">—</div></div>
            <div class="sortie"><div class="decal"><span class="lbl">+ 65 jours</span><button class="copie" data-copie="date" data-cible="o1r" type="button" aria-label="Copier la date + 65 jours" title="Copier" disabled><svg class="ic-copie" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic-ok" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div><div class="date" id="o1r">—</div></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
/* ═══ Structure du questionnaire ═══
   mode "tout" : validé quand toutes les sous-tâches le sont
   mode "un"   : branches au choix, une seule valide la tâche */
const TACHES = [
  { id: "t1", lib: "Réception dossier", mode: "tout", resp: "cab", enCours: "Incomplète", attente: "En attente des pièces",
    okStatut: "Dossier complet", okDecision: "Recevable", apres: "Passer au contrôle de conformité", kids: [
    { id: "t1a", lib: "Demande de raccordement reçue" },
    { id: "t1b", lib: "Plans de l'immeuble reçus" },
    { id: "t1c", lib: "Permis de construire joint" },
    { id: "t1d", lib: "Coordonnées du cabinet conseil" } ] },
  { id: "t2", lib: "Conformité", mode: "un", apres: "Lancer l'étude technique", kids: [
    { id: "t2a", lib: "2a  Conforme", court: "Conforme", mode: "tout", kids: [
      { id: "t2a1", lib: "Plans vérifiés" },
      { id: "t2a2", lib: "Nombre d'EL cohérent avec les plans" },
      { id: "t2a3", lib: "Adresse et IMB contrôlés" } ] },
    { id: "t2b", lib: "2b  Non conforme", court: "Non conforme", mode: "tout", resp: "cab", attente: "Attendre les compléments du cabinet", kids: [
      { id: "t2b1", lib: "Anomalies notifiées au cabinet conseil" },
      { id: "t2b2", lib: "Compléments demandés" } ] } ] },
  /* étapes 3 à 7 : contenu inventé pour la démonstration */
  { id: "t3", lib: "Étude technique", mode: "tout", resp: "Bureau d'études", attente: "Étude en cours",
    okStatut: "Étude terminée", okDecision: "Faisable", apres: "Planifier l'intervention", kids: [
    { id: "t3a", lib: "Point de branchement (PBO) identifié" },
    { id: "t3b", lib: "Cheminement du câble validé" },
    { id: "t3c", lib: "Devis de raccordement envoyé" },
    { id: "t3d", lib: "Commande reçue" } ] },
  { id: "t4", lib: "Planification", mode: "tout", resp: "Moi", attente: "Rendez-vous à caler",
    okStatut: "Intervention planifiée", okDecision: "Date confirmée", apres: "Lancer les travaux", kids: [
    { id: "t4a", lib: "Date d'intervention fixée" },
    { id: "t4b", lib: "Technicien affecté" },
    { id: "t4c", lib: "Syndic ou gestionnaire prévenu" } ] },
  { id: "t5", lib: "Travaux", mode: "tout", resp: "Sous-traitant", attente: "Chantier en cours",
    okStatut: "Travaux terminés", okDecision: "Prêt pour la recette", apres: "Faire la recette", kids: [
    { id: "t5a", lib: "Câblage de la colonne montante" },
    { id: "t5b", lib: "Pose des prises (PTO) dans les logements" },
    { id: "t5c", lib: "Raccordement au point de branchement" },
    { id: "t5d", lib: "Photos d'intervention reçues" } ] },
  { id: "t6", lib: "Recette", mode: "un", apres: "Mettre en service", kids: [
    { id: "t6a", lib: "6a  Recette conforme", court: "Recette conforme", mode: "tout", kids: [
      { id: "t6a1", lib: "Mesures optiques dans les tolérances" },
      { id: "t6a2", lib: "PV de recette signé" } ] },
    { id: "t6b", lib: "6b  Recette avec réserves", court: "Réserves", mode: "tout", resp: "Sous-traitant", attente: "Faire lever les réserves", kids: [
      { id: "t6b1", lib: "Réserves notifiées au sous-traitant" },
      { id: "t6b2", lib: "Reprise planifiée" } ] } ] },
  { id: "t7", lib: "Mise en service", mode: "tout", resp: "Moi", attente: "Clôture en cours",
    okStatut: "Immeuble raccordé", okDecision: "Dossier clos", apres: "Archiver le dossier", kids: [
    { id: "t7a", lib: "Dossier de récolement transmis" },
    { id: "t7b", lib: "IMB passés actifs dans le SI" },
    { id: "t7c", lib: "Dossier clôturé" } ] }
];

const CLE = "racco-d2-v1";
let etat = { coches: {}, fiche: {}, fermes: {}, sel: null };
try { const s = JSON.parse(localStorage.getItem(CLE) || "null"); if (s && typeof s === "object") ["coches", "fiche", "fermes"].forEach(k => { if (s[k] && typeof s[k] === "object") etat[k] = s[k]; }), etat.sel = typeof s.sel === "string" ? s.sel : null; } catch (e) {}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} };

/* index parent / nœuds */
const NOEUDS = {}, PARENT = {};
(function idx(list, p) { list.forEach(n => { NOEUDS[n.id] = n; PARENT[n.id] = p; if (n.kids) idx(n.kids, n); }); })(TACHES, null);
const desc = n => (n.kids || []).flatMap(k => [k, ...desc(k)]);
/* descendants à cocher en cascade : on ne descend pas dans les branches au choix */
const cascade = n => n.mode === "un" ? [] : (n.kids || []).flatMap(k => [k, ...cascade(k)]);
const anc = n => { const a = []; let p = PARENT[n.id]; while (p) { a.push(p); p = PARENT[p.id]; } return a; };

/* état enregistré avant l'ajout des sous-tâches : une étape cochée coche ses sous-tâches */
Object.keys(etat.coches).forEach(id => { const n = NOEUDS[id]; if (!n) delete etat.coches[id]; else cascade(n).forEach(d => etat.coches[d.id] = true); });

function valide(n) {
  if (etat.coches[n.id]) return true;
  if (!n.kids) return false;
  return n.mode === "un" ? n.kids.some(valide) : n.kids.every(valide);
}

function basculer(n, on) {
  if (verrouillee(n)) { rendu(); return; }
  if (on) {
    etat.coches[n.id] = true;
    cascade(n).forEach(d => etat.coches[d.id] = true);
    // branches au choix : cocher dans une branche efface les autres
    [n, ...anc(n)].forEach(x => {
      const p = PARENT[x.id];
      if (p && p.mode === "un") p.kids.filter(k => k !== x).forEach(k => { delete etat.coches[k.id]; desc(k).forEach(d => delete etat.coches[d.id]); });
    });
  } else {
    delete etat.coches[n.id];
    desc(n).forEach(d => delete etat.coches[d.id]);
    anc(n).forEach(a => delete etat.coches[a.id]);
  }
  sauver(); rendu();
}

/* ═══ Résultats : 5 informations selon les cases ═══ */
const manquants = n => desc(n).filter(d => !d.kids && !valide(d)).map(d => d.lib);
const fiche = k => (etat.fiche[k] || "").trim();
function delaiDLPI() {
  if (!fiche("dlpi")) return "DLPI non renseignée";
  const j = Math.round((new Date(fiche("dlpi") + "T00:00") - new Date(new Date().toDateString())) / 864e5);
  return j > 0 ? `J-${j} avant la DLPI` : j === 0 ? "DLPI aujourd'hui" : `DLPI dépassée de ${-j} j`;
}
function resultat(t) {
  const cab = fiche("cab") || "Cabinet conseil", D = delaiDLPI();
  const qui = n => n.resp === "cab" ? cab : (n.resp || "Moi");
  if (verrouillee(t)) { const p = TACHES.indexOf(t); return { tag: "none", txt: "Verrouillée", statut: "Pas encore accessible", decision: "—", action: `Valider d'abord l'étape ${p} · ${TACHES[p - 1].lib}`, resp: "—", delai: D }; }
  if (t.mode === "un") {
    // première branche = issue favorable, seconde = blocage
    const [a, b] = t.kids;
    if (valide(a)) return { tag: "ok", txt: a.court, statut: a.court, decision: "Accepté", action: t.apres, resp: "Moi", delai: D };
    if (valide(b)) return { tag: "ko", txt: b.court, statut: b.court, decision: "Suspendu", action: b.attente, resp: qui(b), delai: D };
    const enA = a.kids.some(valide), enB = b.kids.some(valide);
    if (etat.coches[t.id] && !enA && !enB) return { tag: "ok", txt: "Validée", statut: "Validée sans précision", decision: "À préciser", action: `Indiquer « ${a.court} » ou « ${b.court} »`, resp: "Moi", delai: D };
    if (enA) return { tag: "run", txt: "En cours", statut: `Vers « ${a.court} »`, decision: "En cours", action: manquants(a), resp: "Moi", delai: D };
    if (enB) return { tag: "run", txt: "En cours", statut: `Vers « ${b.court} »`, decision: "En cours", action: manquants(b), resp: "Moi", delai: D };
    return { tag: "none", txt: "À contrôler", statut: "Pas encore contrôlé", decision: "—", action: `Choisir « ${a.court} » ou « ${b.court} »`, resp: "Moi", delai: D };
  }
  if (valide(t)) return { tag: "ok", txt: "Validée", statut: t.okStatut || "Étape validée", decision: t.okDecision || "—", action: t.apres || "Passer à l'étape suivante", resp: "Moi", delai: D };
  const m = manquants(t), total = desc(t).filter(d => !d.kids).length, fait = total - m.length;
  if (fait > 0 || t.enCours) return { tag: "run", txt: t.enCours || "En cours", statut: `${t.lib} : ${fait}/${total}`, decision: t.attente || "En cours", action: m, resp: qui(t), delai: D };
  return { tag: "none", txt: "À faire", statut: "Pas commencée", decision: "—", action: m, resp: qui(t), delai: D };
}

/* ═══ Rendu ═══ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ligneHTML(n, d, num) {
  const v = valide(n), auto = v && !etat.coches[n.id];
  let h = `<div class="ligne d${d}${v ? " valide" : ""}">`;
  if (d === 1) h += n.kids ? `<button class="chev" type="button" data-chev="${n.id}" aria-label="Réduire ou déplier" aria-expanded="${!etat.fermes[n.id]}">▼</button>` : `<span class="chev vide" aria-hidden="true"></span>`;
  h += `<input type="checkbox" class="cb${auto ? " auto" : ""}" id="cb_${n.id}" data-cb="${n.id}"${v ? " checked" : ""}${verrouillee(n) ? " disabled" : ""} aria-label="${esc(n.lib)}">`;
  h += `<label class="lib" for="cb_${n.id}" ${d === 1 ? `data-sel="${n.id}"` : ""}>${d === 1 ? `<span class="num">${num}</span>` : ""}${esc(n.lib)}</label>`;
  if (d === 1) { const r = resultat(n), ok = r.tag === "ok"; h += `<span class="led ${ok ? "on" : "off"}" role="img" aria-label="${esc(r.txt)}" title="${esc(r.txt)}"></span>`; }
  h += `</div>`;
  if (n.kids) {
    const inner = n.kids.map((k, i) => (n.mode === "un" && i > 0 ? `<div class="ou">ou</div>` : "") + ligneHTML(k, d + 1)).join("");
    h += d === 1 ? `<div class="enfants">${inner}</div>` : inner;
  }
  return h;
}

/* une tâche est acquise quand elle est validée sans être bloquante (non conforme = suspendu) */
const acquise = t => !verrouillee(t) && valide(t) && resultat(t).tag !== "ko";
/* une grande tâche n'est accessible que si la précédente est validée */
const racine = n => { let r = n; while (PARENT[r.id]) r = PARENT[r.id]; return r; };
function verrouillee(n) { const i = TACHES.indexOf(racine(n)); return i > 0 && !acquise(TACHES[i - 1]); }
function etapeCourante() { return TACHES.find(t => !acquise(t)) || null; }

function rendu() {
  const focus = document.activeElement && document.activeElement.id;
  const cour = etapeCourante();
  const sel = TACHES.find(t => t.id === etat.sel) || cour || TACHES[TACHES.length - 1];
  $("arbre").innerHTML = TACHES.map((t, i) =>
    `<div class="gt${etat.fermes[t.id] || verrouillee(t) ? " ferme" : ""}${verrouillee(t) ? " verrou" : ""}${t === sel ? " actif" : ""}">${ligneHTML(t, 1, i + 1)}</div>`).join("");

  const nbOk = TACHES.filter(acquise).length;
  $("compteur").textContent = `${nbOk} / ${TACHES.length}`;
  $("compteur").className = "tag " + (nbOk === TACHES.length ? "ok" : nbOk ? "run" : "none");

  $("frise").innerHTML = TACHES.map((t, i) => {
    const r = resultat(t);
    const cls = r.tag === "ko" ? "ko" : acquise(t) ? "ok" : t === cour ? "run" : "";
    return `<button type="button" id="et_${t.id}" class="etape ${cls}${t === sel ? " sel" : ""}" data-sel="${t.id}" title="${esc(t.lib)}"><span class="n">${i + 1}</span><span class="t">${esc(t.lib)}</span></button>`;
  }).join("");

  const r = resultat(sel);
  $("situTitre").textContent = `${TACHES.indexOf(sel) + 1} · ${sel.lib}`;
  $("situTag").className = "tag " + r.tag; $("situTag").textContent = r.txt;
  const act = Array.isArray(r.action) ? `<ul>${r.action.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : esc(r.action);
  $("infos").innerHTML = [["Statut", esc(r.statut)], ["Décision", esc(r.decision)], ["Action suivante", act], ["Responsable", esc(r.resp)], ["Délai", esc(r.delai)]]
    .map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join("");

  $("etatGlobal").className = "tag " + (cour ? "run" : "ok");
  $("etatGlobal").textContent = cour ? `Étape ${TACHES.indexOf(cour) + 1} en cours` : "Dossier terminé";
  $("situNote").textContent = sel === cour || !cour ? "Touche une étape de la frise ou le nom d'une grande tâche pour voir sa situation."
    : `Étape en cours : ${TACHES.indexOf(cour) + 1} · ${cour.lib}`;

  majCode(); majAutre();
  if (focus && $(focus) && document.activeElement !== $(focus)) $(focus).focus();
}

/* ═══ DLPI : JJ/MM/AAAA au clavier, ou calendrier ; enregistrée en AAAA-MM-JJ ═══ */
const dlpi = $("f_dlpi"), dlpiCal = $("f_dlpi_cal");
const isoVersFr = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
function frVersIso(fr) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(fr); if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? `${m[3]}-${m[2]}-${m[1]}` : null;
}
function poserDlpi(iso) { etat.fiche.dlpi = iso; dlpi.value = isoVersFr(iso); dlpi.classList.remove("invalide"); sauver(); rendu(); }
dlpi.value = isoVersFr(etat.fiche.dlpi);
dlpi.addEventListener("input", () => {
  // barres ajoutées toutes seules : 08102026 → 08/10/2026
  const ch = dlpi.value.replace(/\D/g, "").slice(0, 8);
  dlpi.value = ch.length > 4 ? `${ch.slice(0, 2)}/${ch.slice(2, 4)}/${ch.slice(4)}` : ch.length > 2 ? `${ch.slice(0, 2)}/${ch.slice(2)}` : ch;
  const iso = frVersIso(dlpi.value);
  dlpi.classList.toggle("invalide", ch.length === 8 && !iso);
  if (iso || ch.length === 0) { etat.fiche.dlpi = iso || ""; sauver(); rendu(); }
});
dlpi.addEventListener("blur", () => { if (!frVersIso(dlpi.value)) { dlpi.value = isoVersFr(etat.fiche.dlpi); dlpi.classList.remove("invalide"); } });
$("calDlpi").onclick = () => {
  dlpiCal.value = etat.fiche.dlpi || versIso(new Date());
  try { dlpiCal.showPicker(); } catch (e) { dlpiCal.focus(); dlpiCal.click(); }
};
dlpiCal.addEventListener("change", () => { if (dlpiCal.value) poserDlpi(dlpiCal.value); });

/* ═══ Regroupement syndic : autant d'IMB que voulu, défilement horizontal ═══
   chaque IMB : { imb, adr, el, elR, elP, note } ; adresse, EL et commentaire dans une bulle au survol */
const imbVide = (imb = "") => ({ imb, adr: "", el: "", elR: "", elP: "", note: "" });
if (!Array.isArray(etat.fiche.imbs)) {
  // anciens dossiers : les 4 cases IMB fixes deviennent la liste
  etat.fiche.imbs = [1, 2, 3, 4].map(i => etat.fiche["imb" + i] || "");
  [1, 2, 3, 4].forEach(i => delete etat.fiche["imb" + i]);
}
etat.fiche.imbs = etat.fiche.imbs.map(x => typeof x === "string" ? imbVide(x) : Object.assign(imbVide(), x));
while (etat.fiche.imbs.length < 4) etat.fiche.imbs.push(imbVide());
const aInfo = o => !!(o.adr || o.el || o.elR || o.elP || o.note);
function rendreImbs(focusIndex) {
  const L = etat.fiche.imbs, liste = $("imbListe");
  liste.innerHTML = L.map((o, i) =>
    `<div class="imb-item${aInfo(o) ? " info" : ""}${i === imbOuvert ? " actif" : ""}" data-item="${i}"><input id="imb${i}" data-imb="${i}" value="${esc(o.imb)}" placeholder="IMB/…" aria-label="IMB ${i + 1}" autocomplete="off">` +
    (L.length > 4 && !o.imb.trim() && !aInfo(o) ? `<button class="suppr" type="button" data-suppr="${i}" aria-label="Supprimer la case IMB ${i + 1}" title="Supprimer">×</button>` : "") +
    `</div>`).join("") + `<button class="imb-plus" type="button" id="imbPlus" aria-label="Ajouter un IMB" title="Ajouter un IMB">+</button>`;
  if (focusIndex != null) { const f = $("imb" + focusIndex); f.focus(); f.scrollIntoView({ block: "nearest", inline: "nearest" }); }
}
$("imbListe").addEventListener("input", e => {
  const i = e.target.dataset.imb; if (i == null) return;
  const o = etat.fiche.imbs[i], avant = o.imb.trim();
  o.imb = e.target.value; sauver();
  if (+i === imbOuvert) $("imbBulleTitre").textContent = o.imb.trim() || `IMB ${+i + 1}`;
  if (etat.fiche.imbs.length > 4 && !avant !== !o.imb.trim()) rendreImbs(+i);   // affiche ou retire la croix
});
$("imbListe").addEventListener("click", e => {
  if (e.target.closest("#imbPlus")) { fermerImb(); etat.fiche.imbs.push(imbVide()); sauver(); rendreImbs(etat.fiche.imbs.length - 1); return; }
  const s = e.target.closest("[data-suppr]");
  if (s) { fermerImb(); etat.fiche.imbs.splice(+s.dataset.suppr, 1); sauver(); rendreImbs(); }
});

/* bulle d'un IMB : s'ouvre au survol, se ferme au clic ailleurs ou avec Échap (comme celle du Nombre d'EL) */
let imbOuvert = null;
const imbBulle = $("imbBulle");
function ouvrirImb(i) {
  const item = document.querySelector(`[data-item="${i}"]`); if (!item) return;
  imbOuvert = i;
  const o = etat.fiche.imbs[i];
  $("imbBulleTitre").textContent = o.imb.trim() || `IMB ${i + 1}`;
  imbBulle.querySelectorAll("[data-info]").forEach(c => c.value = o[c.dataset.info] || "");
  imbBulle.hidden = false;
  // sous la case survolée, sans sortir de la carte
  const zone = $("regroupZone").getBoundingClientRect(), r = item.getBoundingClientRect();
  const larg = imbBulle.offsetWidth;
  imbBulle.style.left = Math.max(0, Math.min(r.left - zone.left, zone.width - larg)) + "px";
  imbBulle.style.top = (r.bottom - zone.top) + "px";
  document.querySelectorAll(".imb-item.actif").forEach(x => x.classList.remove("actif"));
  item.classList.add("actif");
}
function fermerImb() {
  if (imbOuvert == null) return;
  imbOuvert = null; imbBulle.hidden = true;
  if (imbBulle.contains(document.activeElement)) document.activeElement.blur();
  rendreImbs();
}
$("imbListe").addEventListener("mouseover", e => {
  const item = e.target.closest("[data-item]"); if (!item) return;
  const i = +item.dataset.item;
  // on ne change pas d'IMB pendant qu'on écrit dans la bulle
  if (i !== imbOuvert && !imbBulle.contains(document.activeElement)) ouvrirImb(i);
});
imbBulle.addEventListener("input", e => {
  const c = e.target.dataset.info; if (!c || imbOuvert == null) return;
  if (c !== "adr" && c !== "note") e.target.value = e.target.value.replace(/\D/g, "");
  etat.fiche.imbs[imbOuvert][c] = e.target.value; sauver();
  document.querySelector(`[data-item="${imbOuvert}"]`)?.classList.toggle("info", aInfo(etat.fiche.imbs[imbOuvert]));
});
document.addEventListener("pointerdown", e => { if (imbOuvert != null && !imbBulle.contains(e.target) && !e.target.closest(".imb-item")) fermerImb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && imbOuvert != null) fermerImb(); });
$("imbListe").addEventListener("scroll", () => { if (imbOuvert != null && !imbBulle.contains(document.activeElement)) fermerImb(); });
rendreImbs();

/* ═══ Import de l'export Excel des IMB (une ligne par IMB, un seul regroupement par fichier) ═══
   colonnes : A Dossier (IMB), D Code Regroupement Syndic, W..AD adresse, AU / AV / AW logements (total, R = particuliers, P = pro) */
const SHEETJS = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
function chargerSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = SHEETJS; sc.onload = ok; sc.onerror = () => ko(new Error("lecteur Excel introuvable (connexion internet ?)")); document.head.appendChild(sc); });
}
const COL = { imb: 0, regroup: 3, num: 22, cplt: 23, voie: 24, adresse: 25, bat: 26, esc: 27, cp: 28, loc: 29, el: 46, elR: 47, elP: 48 };
const txt = v => (v == null ? "" : String(v)).trim();
const nombre = v => { const t = txt(v).replace(",", "."); return t === "" || isNaN(+t) ? t.replace(/\D/g, "") : String(Math.round(+t)); };
function adresseLigne(r) {
  const rue = [txt(r[COL.num]), txt(r[COL.cplt]), txt(r[COL.voie])].filter(Boolean).join(" ");
  const ad = txt(r[COL.adresse]);
  const parts = [];
  if (rue) parts.push(rue);
  if (ad && (!rue || !ad.toLowerCase().includes(rue.toLowerCase()))) parts.push(ad);
  if (txt(r[COL.bat])) parts.push("Bât. " + txt(r[COL.bat]));
  if (txt(r[COL.esc])) parts.push("Esc. " + txt(r[COL.esc]));
  const ville = [txt(r[COL.cp]), txt(r[COL.loc])].filter(Boolean).join(" ");
  if (ville) parts.push(ville);
  return parts.join(", ");
}
function messageImport(t, ko) { const m = $("importMsg"); m.textContent = t; m.classList.toggle("ko", !!ko); m.hidden = false; clearTimeout(m._t); m._t = setTimeout(() => m.hidden = true, 6000); }
$("imbFichier").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    await chargerSheetJS();
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const lignes = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: true });
    // la ligne d'en-tête est celle dont la colonne A vaut « Dossier »
    const h = lignes.findIndex(r => txt(r[0]).toLowerCase() === "dossier");
    if (h < 0) throw new Error("colonne « Dossier » introuvable");
    const data = lignes.slice(h + 1).filter(r => txt(r[COL.imb]));
    if (!data.length) throw new Error("aucun IMB dans le fichier");
    const actuels = etat.fiche.imbs.filter(o => o.imb.trim());
    if (actuels.length && !confirm(`Remplacer les ${actuels.length} IMB actuels par les ${data.length} du fichier ?`)) return;
    const notes = Object.fromEntries(etat.fiche.imbs.filter(o => o.imb.trim() && o.note).map(o => [o.imb.trim(), o.note]));
    fermerImb();
    etat.fiche.imbs = data.map(r => ({ imb: txt(r[COL.imb]), adr: adresseLigne(r), el: nombre(r[COL.el]), elR: nombre(r[COL.elR]), elP: nombre(r[COL.elP]),
      note: notes[txt(r[COL.imb])] || "" }));   // un commentaire déjà écrit sur le même IMB est gardé
    while (etat.fiche.imbs.length < 4) etat.fiche.imbs.push(imbVide());
    const code = data.map(r => txt(r[COL.regroup])).find(Boolean);
    if (code) { etat.fiche.ref = code; $("f_ref").value = code; }
    sauver(); rendreImbs(); rendu();
    messageImport(`${data.length} IMB importés${code ? " · regroupement " + code : ""}`);
  } catch (err) { messageImport("Import impossible : " + err.message, true); }
});

/* ═══ Nombre d'EL : bulle de commentaires et de captures, ouverte au survol ═══ */
const CAPCLE = "racco-d2-captures";          // captures à part : l'état principal reste léger

try { const c = JSON.parse(localStorage.getItem(CAPCLE) || "[]"); if (Array.isArray(c)) captures = c.filter(x => typeof x === "string"); } catch (e) {}
const bulle = $("bulle"), elZone = $("elZone"), noteBtn = $("noteBtn"), noteTexte = $("noteTexte");

function rendreCaptures() {
  $("captures").innerHTML = captures.map((src, i) =>
    `<div class="capture" data-voir="${i}"><img src="${src}" alt="Capture ${i + 1}"><button type="button" data-ret="${i}" aria-label="Retirer la capture ${i + 1}" title="Retirer">×</button></div>`).join("");
  majNoteBtn();
}
function sauverCaptures() {
  try { localStorage.setItem(CAPCLE, JSON.stringify(captures)); return true; } catch (e) { return false; }
}
// réduit l'image (1400 px max, JPEG) pour tenir dans la mémoire du navigateur
function reduire(fichier) {
  return new Promise((ok, ko) => {
    const lect = new FileReader();
    lect.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = ko; img.src = lect.result;
    };
    lect.onerror = ko; lect.readAsDataURL(fichier);
  });
}
async function ajouterCaptures(fichiers) {
  for (const f of fichiers) {
    if (!f.type.startsWith("image/")) continue;
    try { captures.push(await reduire(f)); } catch (e) { continue; }
    if (!sauverCaptures()) { captures.pop(); sauverCaptures(); alert("Plus de place pour d'autres captures : retires-en une avant d'en ajouter."); break; }
  }
  rendreCaptures();
}
$("noteFichier").addEventListener("change", e => { ajouterCaptures([...e.target.files]); e.target.value = ""; });
bulle.addEventListener("paste", e => {
  const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (imgs.length) { e.preventDefault(); ajouterCaptures(imgs); }
});
bulle.addEventListener("dragover", e => { e.preventDefault(); bulle.classList.add("depot"); });
bulle.addEventListener("dragleave", () => bulle.classList.remove("depot"));
bulle.addEventListener("drop", e => { e.preventDefault(); bulle.classList.remove("depot"); ajouterCaptures([...e.dataTransfer.files]); });
$("captures").addEventListener("click", e => {
  const r = e.target.closest("[data-ret]");
  if (r) { captures.splice(+r.dataset.ret, 1); sauverCaptures(); rendreCaptures(); return; }
  const v = e.target.closest("[data-voir]");
  if (v) {
    const vis = document.createElement("div"); vis.className = "visionneuse";
    vis.innerHTML = `<img src="${captures[+v.dataset.voir]}" alt="Capture agrandie">`;
    vis.onclick = () => vis.remove(); document.body.appendChild(vis);
  }
});
rendreCaptures();

/* ═══ Code Comlab (25 caractères) — MÉTHODE PROVISOIRE, à remplacer par la vraie règle ═══
   1 à 7   : une lettre par grande tâche (V validée, E en cours, N non conforme, A à faire)
   8 à 21  : les sous-tâches finales, 1 cochée / 0 non, regroupées par 5 en un caractère base 32 (70 cases max)
   22 à 25 : contrôle, empreinte FNV-1a des 21 premiers caractères en base 32 (sans I, L, O, U) */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const feuilles = n => n.kids ? n.kids.flatMap(feuilles) : [n];
function codeComlab() {
  const cour = etapeCourante();
  const etats = TACHES.map(t => { const r = resultat(t); return r.tag === "ko" ? "N" : acquise(t) ? "V" : (t === cour && r.tag === "run") ? "E" : "A"; }).join("");
  const cases = TACHES.flatMap(t => t.kids ? feuilles(t).filter(f => f !== t) : [t]).map(f => valide(f) ? "1" : "0").join("");
  const bits = (cases + "0".repeat(70)).slice(0, 70);
  const corps = (etats + bits.match(/.{5}/g).map(b => B32[parseInt(b, 2)]).join("")).slice(0, 21);
  let h = 0x811c9dc5;
  for (const c of corps) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  let ctrl = ""; for (let i = 0; i < 4; i++) { ctrl += B32[h & 31]; h >>>= 5; }
  return corps + ctrl;
}
function majCode() { $("comlab").textContent = codeComlab().replace(/(.{5})(?=.)/g, "$1 "); }
/* ═══ Codes APE, DZI, RTY et LVE — MÉTHODE PROVISOIRE : dérivés des mêmes réponses que le code Comlab ═══
   APE : 15 caractères, DZI : 20, RTY : 10, LVE : 10, en base 32 */
const AUTRES = { ape: 15, dzi: 20, rty: 10, lve: 10 };
function codeAutre(nom) {
  let h = 0x811c9dc5, r = "";
  const graine = nom + codeComlab();
  while (r.length < AUTRES[nom]) {
    for (const c of graine + r.length) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    r += B32[h & 31] + B32[(h >>> 5) & 31];
  }
  return r.slice(0, AUTRES[nom]);
}
const groupes = c => c.replace(/(.{5})(?=.)/g, "$1 ");
function majAutre() { Object.keys(AUTRES).forEach(n => { $("code_" + n).textContent = groupes(codeAutre(n)); }); }
/* icône de copie : passe en coche verte un instant ; sinon sélectionne le code pour Ctrl+C */
document.querySelectorAll("[data-copie]").forEach(b => b.onclick = () => {
  const n = b.dataset.copie;
  const zone = n === "date" ? $(b.dataset.cible) : n === "comlab" ? $("comlab") : $("code_" + n);
  const v = n === "date" ? zone.dataset.val : n === "comlab" ? codeComlab() : codeAutre(n);
  if (!v) return;
  const ok = () => { b.classList.add("fait"); b.title = "Copié"; clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("fait"); b.title = "Copier"; }, 1500); };
  const repli = () => { const r = document.createRange(); r.selectNodeContents(zone); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.title = "Code sélectionné : Ctrl+C (ou Cmd+C)"; };
  try { navigator.clipboard.writeText(v).then(ok, repli); } catch (e) { repli(); }
});

/* ═══ Dates : une date de départ donne la date à +30 et à +65 jours ═══ */
const CCLE = "racco-d2-date";
const DELAIS = [30, 65]; // jours calendaires
const pad = n => String(n).padStart(2, "0");
const versIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const jour = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
/* jours fériés français (Pâques par l'algorithme grégorien anonyme) */
function paques(a) {
  const b = a % 19, c = Math.floor(a / 100), d = a % 100, e = Math.floor(c / 4), f = c % 4, g = Math.floor((c + 8) / 25), h = Math.floor((c - g + 1) / 3);
  const i = (19 * b + c - e - h + 15) % 30, k = Math.floor(d / 4), l = d % 4, m = (32 + 2 * f + 2 * k - i - l) % 7, n = Math.floor((b + 11 * i + 22 * m) / 451);
  const mois = Math.floor((i + m - 7 * n + 114) / 31), j = ((i + m - 7 * n + 114) % 31) + 1;
  return new Date(a, mois - 1, j);
}
const FERIES = {};
function ferie(d) {
  const a = d.getFullYear();
  if (!FERIES[a]) { const p = paques(a); FERIES[a] = new Set([new Date(a, 0, 1), jour(p, 1), new Date(a, 4, 1), new Date(a, 4, 8), jour(p, 39), jour(p, 50), new Date(a, 6, 14), new Date(a, 7, 15), new Date(a, 10, 1), new Date(a, 10, 11), new Date(a, 11, 25)].map(versIso)); }
  return FERIES[a].has(versIso(d));
}
const ouvre = d => d.getDay() % 6 !== 0 && !ferie(d);
const fmtD = d => d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
function dateChoisie() {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec($("cDate").value);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function majCalc() {
  const d = dateChoisie();
  $("cExpr").textContent = d ? `Départ · ${d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short", year: "numeric" })}` : "Date de départ";
  DELAIS.forEach((n, i) => {
    let h = "—", val = "";
    if (d) {
      const r = jour(d, n);
      val = `${pad(r.getDate())}/${pad(r.getMonth() + 1)}/${r.getFullYear()}`;
      const note = ouvre(r) ? "" : `<span class="tag ko">${ferie(r) ? "Férié" : "Week-end"}</span>`;
      h = `${note}<span>${esc(fmtD(r))}</span>`;
    }
    [`o${i}r`, `i${i}r`].forEach(id => { if ($(id)) { $(id).innerHTML = h; $(id).dataset.val = val; } });
    document.querySelectorAll(`[data-cible="o${i}r"], [data-cible="i${i}r"]`).forEach(b => { b.disabled = !val; });
  });
}
try { const v = localStorage.getItem(CCLE); if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) $("cDate").value = v; } catch (e) {}
$("cDate").addEventListener("input", () => { try { localStorage.setItem(CCLE, $("cDate").value); } catch (e) {} majCalc(); });
$("cAuj").onclick = () => { $("cDate").value = versIso(new Date()); $("cDate").dispatchEvent(new Event("input")); };

/* ═══ Grand écran : la page grossit pour remplir l'écran, sans que la colonne droite dépasse la hauteur ═══ */
const LARGEUR_BASE = 1440;
function ajusterEchelle() {
  const page = document.querySelector(".page"), droite = document.querySelector(".col.droite");
  page.style.zoom = ""; page.style.maxWidth = ""; droite.style.maxHeight = "";
  if (innerWidth < 1150) return;
  const parLargeur = innerWidth / LARGEUR_BASE;
  // tout doit tenir à l'ouverture : bandeau du haut + colonne droite + marge du bas
  const haut = droite.getBoundingClientRect().top + scrollY;
  const parHauteur = innerHeight / (haut + droite.scrollHeight + 16);
  const z = Math.max(1, Math.min(parLargeur, parHauteur, 2));
  if (z <= 1.02) return;
  page.style.zoom = z;
  page.style.maxWidth = "none";
  droite.style.maxHeight = `${(innerHeight - 24) / z}px`;
}
let attenteEchelle;
addEventListener("resize", () => { clearTimeout(attenteEchelle); attenteEchelle = setTimeout(ajusterEchelle, 100); });

rendu(); majCalc(); ajusterEchelle();
</script>

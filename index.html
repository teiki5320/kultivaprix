<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racco D2</title>
<style>
[hidden] { display: none !important; }
/* Mise en page : écran coupé en deux — questionnaire à gauche, fiche + situation + calculette à droite. Thème « Clay » clair du dashboard. */
:root {
  --fond: #efe3d6; --side: #cfe2d8; --side-text: #3f5a4c;
  --carte: #fffaf4; --carte-2: #f3e7db; --corail: #f4c6b5;
  --texte: #4a4238; --muted: #6d6259; --ligne: rgba(74, 66, 56, .1);
  --peach: #f6d5c9; --sun: #f9e9b8; --sky: #cfdcef; --mint: #d8e9dc;
  --peach-ink: #b5563a; --sun-ink: #8a6410;  --sky-ink: #395884; --mint-ink: #2f6b4a;
  --accent: #e8907a; --accent-fort: #f0a48f; --accent-ink: #33190f; --accent-dim: rgba(232, 144, 122, .28);
  --led-vert: #36c26a; --led-rouge: #e2493a; --ok: #3d7f55; --ok-tint: #d9ead9; --ko: #c1523f; --ko-tint: #f6d5c9;
  --run: #96660f; --run-tint: #f9e9b8; --none: #7d7670; --none-tint: #ebe4dc;
  --clay: inset 2px 2px 5px rgba(255,255,255,.9), inset -3px -3px 8px rgba(120,90,60,.14), 0 10px 22px rgba(120,90,60,.16);
  --clay-sm: inset 1px 1px 3px rgba(255,255,255,.95), inset -2px -2px 5px rgba(120,90,60,.14), 0 5px 12px rgba(120,90,60,.16);
  --inset: inset 2px 2px 6px rgba(120,90,60,.12), inset -1px -1px 3px rgba(255,255,255,.6);
  --pouss: 0 5px 0 rgba(120,90,60,.22); --pouss-bas: 0 2px 0 rgba(120,90,60,.22);
  --font: -apple-system, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; font-size: inherit; color: inherit; }

.page { max-width: 1500px; margin: 0 auto; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 18px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: #2b2b2b; color: #f5f5f5; border-radius: var(--r-xl); padding: 14px 22px; box-shadow: var(--clay-sm); }   /* barre du titre anthracite : le feu et le liseré ressortent */
header.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .02em; }
header.top .sous { font-size: 13px; opacity: .85; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 0; border-radius: var(--r-md); padding: 10px 16px; font-weight: 800; font-size: 13.5px; cursor: pointer;
  background: var(--carte-2); box-shadow: var(--clay-sm); transition: transform .18s var(--bounce); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn-accent { background: var(--accent); color: var(--accent-ink); box-shadow: var(--pouss); }
.btn-accent:active { transform: translateY(3px); box-shadow: var(--pouss-bas); }
.btn:focus-visible, .chev:focus-visible, .etape:focus-visible { outline: none; box-shadow: var(--clay-sm), 0 0 0 3px var(--accent-dim); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.card { background: var(--carte); border-radius: var(--r-lg); box-shadow: var(--clay); padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ── Questionnaire ── */
.gt { border-radius: var(--r-md); background: var(--carte-2); box-shadow: var(--inset); padding: 4px 8px 6px; }
.gt + .gt { margin-top: 10px; }
.gt.actif { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
.gt.verrou .ligne.d1 { opacity: .5; }
.cb:disabled { cursor: not-allowed; }
.cb:disabled + .lib { cursor: default; }
.ligne { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 10px; min-height: 40px; }
.ligne.d1 { font-weight: 800; font-size: 16px; }
/* une graisse et une taille par niveau : très grande, grande, moyenne, sous-tâche */
.ligne.d2 { padding-left: 38px; font-weight: 700; font-size: 15px; }
.ligne.d3 { padding-left: 70px; font-weight: 600; font-size: 14px; }
.ligne.d4 { padding-left: 102px; font-weight: 400; font-size: 13px; min-height: 34px; }
.ligne.d4 .lib { color: var(--muted); }
.ligne.d5 { padding-left: 134px; }
.ligne .lib { flex: 0 1 auto; min-width: 0; cursor: default; }
.ligne.d1 .lib { cursor: pointer; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.ligne.d1 .num { display: inline-block; }   /* le numéro n'est pas souligné */
.ligne .led { margin-left: auto; }
/* outils d'une tâche : date (calendrier) et lien vers le Modop OneDrive */
.outils { display: flex; align-items: center; gap: 6px; flex: none; margin-right: auto; }   /* juste après le texte de la tâche */
.date-mini { position: relative; }
.date-mini input:not(.date-cachee) { width: 128px; border: 0; border-radius: 9px; background: var(--carte); box-shadow: var(--inset); padding: 4px 30px 4px 8px;
  font: inherit; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; min-height: 28px; }
.date-mini input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.date-mini input.invalide { box-shadow: var(--inset), 0 0 0 2px var(--ko); }
.date-mini .cal { width: 22px; height: 22px; right: 3px; }
.modop { position: relative; display: flex; align-items: center; }
.modop-btn { width: 28px; height: 28px; border: 0; border-radius: 9px; padding: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--carte); color: var(--muted); box-shadow: var(--clay-sm); }
.modop-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.modop-btn, .modop-btn.vide, .modop-btn.plein { background: #f5a04b; color: #4a2508; border: 1.5px solid #c46a1c; box-shadow: var(--clay-sm); }
.modop-btn:hover { background: #f7ae63; }
.lien-edit { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border: 0; border-radius: 50%; padding: 0; cursor: pointer; font-size: 10px; line-height: 18px;
  background: var(--carte); color: var(--texte); box-shadow: var(--clay-sm); display: none; }
.modop:hover .lien-edit { display: block; }
.lien-pop { position: fixed; z-index: 60; width: min(360px, 90vw); background: var(--carte); border-radius: var(--r-md); box-shadow: var(--clay), 0 0 0 1px var(--ligne); padding: 10px 12px; display: grid; gap: 8px; }
.lien-pop input { width: 100%; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 7px 10px; font: inherit; font-size: 13px; outline: none; }
.lien-pop input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.lien-pop .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.lien-pop .ko { color: var(--ko); font-size: 12px; font-weight: 700; }
.ligne.valide .lib { color: var(--ok); }
.ligne.barre .lib { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); opacity: .75; }
.ligne .lib { -webkit-user-select: none; user-select: none; }
.num { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-right: 4px; }
.chev { border: 0; background: var(--carte); box-shadow: var(--clay-sm); width: 30px; height: 30px; border-radius: 10px; cursor: pointer; flex: none;
  display: grid; place-items: center; transition: transform .2s var(--bounce); font-size: 12px; }
.gt.ferme .chev { transform: rotate(-90deg); }
.chev.vide { background: none; box-shadow: none; cursor: default; }
.gt.ferme .enfants { display: none; }
.enfants { border-left: 2px dashed var(--ligne); margin-left: 18px; }
.cb { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; margin: 0; border-radius: 8px; cursor: pointer;
  background: var(--carte); box-shadow: var(--inset); display: grid; place-items: center; transition: background .2s; }
.cb::after { content: ""; width: 7px; height: 12px; border: solid var(--carte); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.cb:checked { background: var(--ok); box-shadow: var(--clay-sm); }
.cb:checked::after { opacity: 1; }
.cb.auto:checked { background: var(--mint-ink); }
.cb:focus-visible { outline: none; box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.tag { font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tag.ok { background: var(--ok-tint); color: var(--ok); }
.tag.run { background: var(--run-tint); color: var(--run); }
.tag.ko { background: var(--ko-tint); color: var(--ko); }
.tag.none { background: var(--none-tint); color: var(--none); }
.led { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-right: 6px; }
.led.on { background: radial-gradient(circle at 35% 35%, #c9f5d8 0 18%, var(--led-vert) 45%); box-shadow: 0 0 0 2px rgba(54,194,106,.18), 0 0 8px rgba(54,194,106,.75); }
.led.off { background: radial-gradient(circle at 35% 35%, #ffd2cb 0 18%, var(--led-rouge) 45%); box-shadow: 0 0 0 2px rgba(226,73,58,.16), 0 0 8px rgba(226,73,58,.6); }
.ou { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 0 0 0 38px; }

/* ── Fiche dossier ── */
.card.dossier { padding: 14px 16px; }
.card.dossier h2 { margin-bottom: 10px; }
.fiche { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.champ { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.champ.large { grid-column: 1 / -1; }
.champ label { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.champ input { width: 100%; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 6px 10px; font-size: 14px; outline: none; min-height: 32px; }
.champ input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.champ input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; text-align: left; }
.champ input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.champ input::placeholder { color: var(--muted); opacity: .7; }
/* DLPI : saisie JJ/MM/AAAA + calendrier natif caché derrière l'icône */
.date-champ, .el-champ { position: relative; }
.date-champ input:not(.date-cachee) { padding-right: 34px; font-variant-numeric: tabular-nums; }
.date-champ input.invalide { box-shadow: var(--inset), 0 0 0 2px var(--ko); }
.cal, .note-btn { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 8px; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--carte); color: var(--muted); box-shadow: var(--clay-sm); }
.cal svg, .note-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cal:hover, .note-btn:hover { color: var(--texte); }
.date-cachee { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
/* Nombre d'EL : bulle de commentaires et de captures */
.el-champ input { padding-right: 34px; }
.note-btn.plein { background: var(--accent); color: var(--accent-ink); }
.el-zone { position: relative; }
.bulle { position: absolute; z-index: 30; top: 100%; right: 0; margin-top: 6px; width: min(340px, 86vw); background: var(--carte); border-radius: var(--r-md);
  box-shadow: var(--clay), 0 0 0 1px var(--ligne); padding: 10px 12px; display: grid; gap: 8px; }
.bulle.survol { box-shadow: var(--clay), 0 0 0 2px var(--accent-dim); }
.bulle.epinglee { box-shadow: var(--clay), 0 0 0 2px var(--accent); }   /* épinglée par un clic : reste ouverte */
.bulle-titre { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bulle textarea { width: 100%; resize: vertical; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 7px 10px; font: inherit; font-size: 13.5px; outline: none; min-height: 64px; }
.bulle textarea:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.captures { display: flex; flex-wrap: wrap; gap: 6px; }
.captures:empty { display: none; }
.capture { position: relative; width: 72px; height: 54px; border-radius: 8px; overflow: hidden; box-shadow: var(--clay-sm); cursor: zoom-in; background: var(--carte-2); }
.capture img { width: 100%; height: 100%; object-fit: cover; display: block; }
.capture button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: 0; border-radius: 50%; padding: 0; cursor: pointer; font-size: 12px; line-height: 18px;
  background: rgba(51, 25, 15, .7); color: #fff; }
.bulle-bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bulle-aide { font-size: 11.5px; color: var(--muted); }
.bulle.depot { box-shadow: var(--clay), 0 0 0 3px var(--accent); }
.visionneuse { position: fixed; inset: 0; z-index: 100; background: rgba(40, 30, 20, .75); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.visionneuse img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
/* Regroupement syndic : référence + IMB en nombre libre, défilement horizontal */
.regroup-tete { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.regroup-tete label { flex: none; }
.regroup-tete input { width: min(220px, 55%); }
.regroup-tete .import { margin-left: auto; flex: none; }
.regroup { position: relative; }
.import-msg { font-size: 12px; font-weight: 700; color: var(--ok); margin: 2px 0 4px; }
.import-msg.ko { color: var(--ko); }
.imb-item.info input { box-shadow: var(--inset), inset 0 -2px 0 var(--accent-dim); }
.imb-item.actif input { box-shadow: var(--inset), 0 0 0 2px var(--accent-dim); }
.imb-bulle { right: auto; width: min(320px, 86vw); }
.mini-lab { font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: -4px; }
.el-trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.el-trois > div { display: grid; gap: 6px; }
.bulle input { width: 100%; border: 0; border-radius: 10px; background: var(--carte-2); box-shadow: var(--inset); padding: 6px 9px; font: inherit; font-size: 13.5px; outline: none; min-height: 30px; }
.bulle input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.imb-liste { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.imb-item { position: relative; flex: 0 0 calc((100% - 24px - 32px) / 4); min-width: 118px; scroll-snap-align: start; }
.imb-liste::-webkit-scrollbar { height: 6px; }
.imb-liste::-webkit-scrollbar-thumb { background: var(--ligne); border-radius: 3px; }
.imb-item input { font-family: var(--mono); font-size: 13px; }
.imb-item .suppr { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 20px; height: 20px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--none-tint); color: var(--muted); font-size: 13px; line-height: 20px; }
.imb-plus { flex: 0 0 32px; height: 32px; align-self: center; border: 0; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: 800; color: var(--accent-ink); background: var(--accent); box-shadow: var(--clay-sm); }
.imb-plus:active { transform: scale(.95); }

.btn-mini { padding: 5px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--texte); }

/* ── Une teinte par carte : orange, blanc, noir, gris (les champs prennent la teinte de leur carte) ── */
.c-taches { --carte: #ffffff; --carte-2: #f0efed; }
.c-dossier { --carte: #fde2c8; --carte-2: #fff4ea; --muted: #8a5a33; }
.c-dates { --carte: #dcdcdc; --carte-2: #f3f3f3; --muted: #5a5a5a; }
.c-utiles { --carte: #262626; --carte-2: #3b3b3b; --texte: #f2f2f2; --muted: #b8b8b8; color: var(--texte); }
.c-comm { --carte: #fff7f0; --carte-2: #f1ebe5; }

/* ── Notion d'urgence : feu tricolore dans la barre du titre ── */
header.top { transition: box-shadow .2s; }
header.top.urg-rouge { box-shadow: var(--clay-sm), inset 0 0 0 4px #ff4d3d, 0 0 14px rgba(255, 77, 61, .45); }
header.top.urg-orange { box-shadow: var(--clay-sm), inset 0 0 0 4px #ff9f2e, 0 0 14px rgba(255, 159, 46, .45); }
header.top.urg-vert { box-shadow: var(--clay-sm), inset 0 0 0 4px #3ddc76, 0 0 14px rgba(61, 220, 118, .45); }
.urgence { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.urgence .urg-lib { font-size: 12.5px; font-weight: 800; min-width: 0; }
.feu { display: flex; gap: 6px; padding: 5px 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.feu button { width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; opacity: .35; transition: opacity .15s, transform .15s var(--bounce); }
.feu button:hover { opacity: .6; }
.feu button.on { opacity: 1; transform: scale(1.12); }
.feu .r { background: radial-gradient(circle at 35% 35%, #ffd2cb 0 18%, #e2493a 50%); }
.feu .r.on { box-shadow: 0 0 10px rgba(226, 73, 58, .8); }
.feu .o { background: radial-gradient(circle at 35% 35%, #ffe2bd 0 18%, #f29a2e 50%); }
.feu .o.on { box-shadow: 0 0 10px rgba(242, 154, 46, .8); }
.feu .v { background: radial-gradient(circle at 35% 35%, #c9f5d8 0 18%, #36c26a 50%); }
.feu .v.on { box-shadow: 0 0 10px rgba(54, 194, 106, .8); }

/* ── Dates importantes : 11 dates comme la DLPI ── */
.dates-imp { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; }

/* ── Bas de la colonne droite : Documents POI + Infos utiles (étroit) | Commentaires (large) ── */
.bas-droite { display: grid; grid-template-columns: minmax(270px, 1fr) minmax(0, 1.45fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .bas-droite { grid-template-columns: 1fr; } }
.cote { display: grid; gap: 18px; min-width: 0; }

/* Documents POI : grande tuile lien OneDrive */
.docs { position: relative; }
.docs-tuile { width: 100%; min-height: 70px; border: 1.5px solid #c46a1c; border-radius: var(--r-lg); background: #f5a04b; color: #4a2508; cursor: pointer;
  display: flex; align-items: center; gap: 14px; padding: 10px 16px; font: inherit; font-size: 16px; font-weight: 800; box-shadow: var(--clay); text-align: left; }
.docs-tuile:hover { background: #f7ae63; }
.docs-tuile svg { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.docs-tuile small { display: block; font-size: 11.5px; font-weight: 700; opacity: .8; }
.docs .lien-edit { top: -6px; right: -6px; width: 24px; height: 24px; font-size: 12px; line-height: 24px; }
.docs:hover .lien-edit { display: block; }
.suivi-tuile { background: #2b2b2b; border-color: #000; color: #f2f2f2; }
.suivi-tuile:hover { background: #3a3a3a; }

/* Infos utiles : rubriques en gras, sous-lignes à puce, champs à remplir */
.iu { display: grid; gap: 10px; }
.iu-rub { display: grid; gap: 4px; }
.iu-tete { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
.iu-tete::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--texte); flex: none; }
.iu-ligne { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding-left: 18px; font-size: 13px; position: relative; }
.iu-ligne::before { content: ""; position: absolute; left: 6px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--texte); }
.iu input { border: 0; border-radius: 8px; background: var(--carte-2); box-shadow: var(--inset); padding: 4px 8px; font: inherit; font-size: 13px; outline: none; min-height: 26px; min-width: 0; }
.iu input:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.iu .plein { flex: 1 1 90px; width: 90px; }
.iu .court { flex: 0 1 64px; width: 64px; }
.iu-ligne { flex-wrap: nowrap; }
.iu .fixe { white-space: nowrap; }
.iu-tete input { flex: 1; font-weight: 600; }

.iu-tete:hover > .iu-sup, .iu-ligne:hover > .iu-sup, .iu-sup:focus-visible { visibility: visible; }

/* Commentaires : mémo daté en haut, commentaire de la tâche choisie en dessous */
.card.commentaires { display: grid; gap: 10px; min-height: 460px; align-content: start; }
.memo { display: grid; gap: 4px; max-height: 230px; overflow-y: auto; overflow-x: hidden; padding: 6px; border-radius: var(--r-md); background: var(--carte-2); box-shadow: var(--inset); }

.mt.decochee { background: var(--none-tint); color: var(--none); }
.mt.barree { background: var(--none-tint); color: var(--none); text-decoration: line-through; }
.memo-ligne .mc { flex: none; color: var(--accent); font-size: 12px; }
.memo-ligne .msup { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; opacity: 0; }
.memo-ligne:hover .msup { opacity: 1; }
.note-detail { display: grid; gap: 8px; }
.note-detail[hidden] { display: none; }
.note-aide { font-size: 12.5px; color: var(--muted); }
.note-titre { font-size: 15px; font-weight: 800; }
.note-chemin { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.note-dates { font-size: 12px; color: var(--muted); font-weight: 700; }
.note-detail textarea { width: 100%; resize: vertical; border: 0; border-radius: 12px; background: var(--carte-2); box-shadow: var(--inset); padding: 9px 12px; font: inherit; font-size: 14px; outline: none; min-height: 140px; }
.note-detail textarea:focus { box-shadow: var(--inset), 0 0 0 3px var(--accent-dim); }
.note-detail.depot { outline: 3px dashed var(--accent); outline-offset: 4px; border-radius: 12px; }
.ligne.choisie .lib { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; }
.ligne .lib[data-note] { cursor: pointer; }

/* ── Grand écran : la colonne droite tient dans la hauteur et reste visible ── */
@media (min-width: 1150px) {
  .page { padding-block: 12px 20px; gap: 12px; }
  header.top { padding: 10px 20px; }
  .split { gap: 12px; }
  .col.droite { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start;
    max-height: calc(100vh - 24px); overflow-y: auto; }
  .col.droite .card { padding: 12px 14px; }
  .col.droite .card h2 { margin-bottom: 8px; }
  .fiche { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
  .champ.adr { grid-column: span 2; }
  .champ input { min-height: 30px; padding: 5px 9px; }
  .bas-droite, .cote { gap: 12px; }
}
/* écrans d'ordinateur peu hauts (portables 13") */
@media (min-width: 1150px) and (max-height: 860px) {
  header.top { padding: 6px 18px; }
  header.top h1 { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

<div class="page">

              <div><div class="note-chemin" id="noteChemin"></div><div class="note-titre" id="noteTitre"></div><div class="note-dates" id="noteDates"></div></div>

<script>
/* ═══ Tâches : les 7 grandes étapes et leurs tâches (4 niveaux au plus) ═══
   mode "tout" : validé quand toutes les sous-tâches sont faites (une tâche barrée ne bloque pas)
   mode "un" + choix : une seule option à cocher, les autres sont barrées automatiquement (contraste) */
const TACHES = [
  { id: "t1", lib: "Réception de la POI", mode: "tout", kids: [
    { id: "t1_1", lib: "Classer les docs GEDAFFAIRE" },
    { id: "t1_2", lib: "Mettre un Geosignet dans GEORESO" },
    { id: "t1_3", lib: "Regarder s’il y a de l’aérien" },
    { id: "t1_4", lib: "Regarder place au PA" },
    { id: "t1_5", lib: "Mettre un ComL + modifier DRE/DLR + passer la POI à l’état 5" } ] },
  { id: "t2", lib: "Réception APD", mode: "tout", kids: [
    { id: "t2_1", lib: "Regarder conformité de l’APD", mode: "tout", kids: [
      { id: "t2_1_1", lib: "APD non conforme", mode: "tout", kids: [
        { id: "t2_1_1_1", lib: "Mettre ComL + modifier DRE/DLR" },
        { id: "t2_1_1_2", lib: "Faire un mail GED à ZZZ Amaris OSA : Bonjour, APD non conforme (indiquer les docs manquants)" } ] },
      { id: "t2_1_2", lib: "APD conforme", mode: "tout", kids: [
        { id: "t2_1_2_1", lib: "Mettre ComL + modifier DRE/DLR" },
        { id: "t2_1_2_2", lib: "Faire un mail GED à ZZZ Amaris OSA : Bonjour, APD conforme." } ] } ] } ] },
  { id: "t3", lib: "Traiter la pré-étude", mode: "tout", kids: [
    { id: "t3_1", lib: "Repasser la POI à l’état 1" },
    { id: "t3_2", lib: "Faire CMS", mode: "tout", kids: [
      { id: "t3_2_1", lib: "Retour CMS OK" } ] },
    { id: "t3_3", lib: "Faire resa au PA", mode: "tout", kids: [
      { id: "t3_3_1", lib: "Faire Desat PMZ" } ] },
    { id: "t3_4", lib: "Faire la demande BANBOU pour dessin TIGRE si j’ai tous les docs", mode: "tout", kids: [
      { id: "t3_4_1", lib: "Faire import PIT quand j’ai le retour BANBOU" } ] },
    { id: "t3_5", lib: "Traiter l’aérien", mode: "tout", kids: [
      { id: "t3_5_1", lib: "Faire le SEPALE" },
      { id: "t3_5_2", lib: "…" } ] },
    { id: "t3_6", lib: "Repasser la POI à l’état 5" } ] },
  { id: "t4", lib: "Traiter la POI d’anticipation", mode: "tout", kids: [
    { id: "t4_1", lib: "Anticipation non nécessaire", mode: "tout", kids: [
      { id: "t4_1_1", lib: "Mettre un ComL d’annulation de la POI" } ] },
    { id: "t4_2", lib: "Anticipation nécessaire", mode: "tout", kids: [
      { id: "t4_2_1", lib: "Repasser la POI à l’état 1" },
      { id: "t4_2_2", lib: "Mettre ComL + modifier DRE/DLR" },
      { id: "t4_2_3", lib: "Monter le dossier travaux d’anticipation", mode: "tout", kids: [
        { id: "t4_2_3_1", lib: "….." },
        { id: "t4_2_3_2", lib: "….." },
        { id: "t4_2_3_3", lib: "….." } ] },
      { id: "t4_2_4", lib: "Envoyer en travaux", mode: "tout", kids: [
        { id: "t4_2_4_1", lib: "Mettre ComL + modifier DRE/DLR" } ] },
      { id: "t4_2_5", lib: "Valider tâche dans SPI ????" },
      { id: "t4_2_6", lib: "Réception du DOE d’anticipation", mode: "tout", kids: [
        { id: "t4_2_6_1", lib: "DOE non conforme" },
        { id: "t4_2_6_2", lib: "DOE Conforme" } ] },
      { id: "t4_2_7", lib: "Faire contraste", mode: "un", choix: true, kids: [
        { id: "t4_2_7_1", lib: "Non conforme avec reprise" },
        { id: "t4_2_7_2", lib: "Non conforme sans reprise" },
        { id: "t4_2_7_3", lib: "Conforme" } ] },
      { id: "t4_2_8", lib: "Payer attachement" },
      { id: "t4_2_9", lib: "Mettre DOE dans SPI ???" },
      { id: "t4_2_10", lib: "Mettre à jour le SI", mode: "tout", kids: [
        { id: "t4_2_10_1", lib: "Étape MAJ SI" },
        { id: "t4_2_10_2", lib: "Étape MAJ SI" },
        { id: "t4_2_10_3", lib: "Étape MAJ SI" } ] },
      { id: "t4_2_11", lib: "Archiver la POI d’anticipation dans PPR" } ] } ] },
  { id: "t5", lib: "Réception DOE précâblage", mode: "tout", kids: [
    { id: "t5_1", lib: "Regarder conformité du DOE", mode: "tout", kids: [
      { id: "t5_1_1", lib: "DOE non conforme", mode: "tout", kids: [
        { id: "t5_1_1_1", lib: "Mettre ComL + modifier DRE/DLR" },
        { id: "t5_1_1_2", lib: "Faire un mail GED à ZZZ Amaris OSA : Bonjour, DOE non conforme (indiquer les docs manquants)" } ] },
      { id: "t5_1_2", lib: "DOE conforme", mode: "tout", kids: [
        { id: "t5_1_2_1", lib: "Mettre ComL + modifier DRE/DLR" },
        { id: "t5_1_2_2", lib: "Faire un mail GED à ZZZ Amaris OSA : Bonjour, DOE conforme." } ] } ] } ] },
  { id: "t6", lib: "Finaliser l’étude", mode: "tout", kids: [
    { id: "t6_1", lib: "Repasser la POI à l’état 1" },
    { id: "t6_2", lib: "Faire la demande BANBOU pour dessin TIGRE si pas déjà faite", mode: "tout", kids: [
      { id: "t6_2_1", lib: "Faire import PIT quand j’ai le retour BANBOU" } ] },
    { id: "t6_3", lib: "Faire le GEORESO + IPON", mode: "tout", kids: [
      { id: "t6_3_1", lib: "Racco D2" },
      { id: "t6_3_2", lib: "DTER (PDO ou DTIO)" } ] },
    { id: "t6_4", lib: "Faire la valo" },
    { id: "t6_5", lib: "Faire la FI" },
    { id: "t6_6", lib: "Faire le LINE" },
    { id: "t6_7", lib: "Envoyer en travaux", mode: "tout", kids: [
      { id: "t6_7_1", lib: "Mettre ComL" } ] },
    { id: "t6_8", lib: "Valider tâche « Lancement travaux » dans SPI" },
    { id: "t6_9", lib: "Demander la MAD anticipée si POI à l’état DMS" } ] },
  { id: "t7", lib: "Réception du DOE Racco D2", mode: "tout", kids: [
    { id: "t7_1", lib: "Vérification faites" },
    { id: "t7_2", lib: "Faire contraste", mode: "un", choix: true, kids: [
      { id: "t7_2_1", lib: "Non conforme avec reprise" },
      { id: "t7_2_2", lib: "Non conforme sans reprise" },
      { id: "t7_2_3", lib: "Conforme" } ] },
    { id: "t7_3", lib: "Payer attachement" },
    { id: "t7_4", lib: "Mettre à jour le SI", mode: "tout", kids: [
      { id: "t7_4_1", lib: "IPON", mode: "tout", kids: [
        { id: "t7_4_1_1", lib: "Récoler tous les projets" },
        { id: "t7_4_1_2", lib: "Vérifier si les dates remontent bien dans IPON" } ] },
      { id: "t7_4_2", lib: "GEORESO", mode: "tout", kids: [
        { id: "t7_4_2_1", lib: "Récoler le projet" } ] },
      { id: "t7_4_3", lib: "SPI", mode: "tout", kids: [
        { id: "t7_4_3_1", lib: "Valider la tâche « Insertion & Vérification DOE »" },
        { id: "t7_4_3_2", lib: "Déposer le DOE au format zip que je retrouve dans LINE (si MAD anticipé on a validé les taches avant de le déposer)" } ] },
      { id: "t7_4_4", lib: "LINE", mode: "tout", kids: [
        { id: "t7_4_4_1", lib: "Cliquer sur « Valider travaux »" },
        { id: "t7_4_4_2", lib: "Cliquer sur « Clôturer le dossier »" },
        { id: "t7_4_4_3", lib: "Cliquer sur « Archiver le dossier »" } ] },
      { id: "t7_4_5", lib: "OPTIMUM", mode: "tout", kids: [
        { id: "t7_4_5_1", lib: "Aller voir si les dates sont bonnes (le lendemain du récolement)" } ] } ] },
    { id: "t7_5", lib: "Demander la MAD au PBLO (si je n’ai pas fait de MAD anticipée)" },
    { id: "t7_6", lib: "Archiver la POI dans PPR" } ] }
];

const CLE = "racco-d2-v1";
let etat = { coches: {}, barres: {}, dates: {}, liens: {}, memo: {}, fiche: {}, fermes: {}, sel: null };
try { const s = JSON.parse(localStorage.getItem(CLE) || "null"); if (s && typeof s === "object") ["coches", "barres", "dates", "liens", "memo", "fiche", "fermes"].forEach(k => { if (s[k] && typeof s[k] === "object") etat[k] = s[k]; }), etat.sel = typeof s.sel === "string" ? s.sel : null; } catch (e) {}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} };
// remise à zéro unique des tests (9 octobre 2026) : tâches et commentaires effacés, le reste du dossier (IMB compris) est gardé
if (!etat.fiche.raz1) {
  etat.coches = {}; etat.barres = {}; etat.dates = {}; etat.memo = {}; etat.sel = null;
  try { localStorage.removeItem("racco-d2-notes-captures"); } catch (e) {}
  etat.fiche.raz1 = true; sauver();
}

/* index parent / nœuds */
const NOEUDS = {}, PARENT = {};
(function idx(list, p) { list.forEach(n => { NOEUDS[n.id] = n; PARENT[n.id] = p; if (n.kids) idx(n.kids, n); }); })(TACHES, null);
const desc = n => (n.kids || []).flatMap(k => [k, ...desc(k)]);
/* descendants à cocher en cascade : on ne descend pas dans les branches au choix */
const cascade = n => n.mode === "un" ? [] : (n.kids || []).flatMap(k => [k, ...cascade(k)]);
const anc = n => { const a = []; let p = PARENT[n.id]; while (p) { a.push(p); p = PARENT[p.id]; } return a; };

/* état enregistré avant l'ajout des sous-tâches : une étape cochée coche ses sous-tâches */
Object.keys(etat.coches).forEach(id => { const n = NOEUDS[id]; if (!n) delete etat.coches[id]; else cascade(n).forEach(d => etat.coches[d.id] = true); });

/* tâche barrée (double-clic sur sa case) : reste visible mais ne bloque pas la tâche du dessus */
const estBarre = n => !!etat.barres[n.id];
function valide(n) {
  if (etat.coches[n.id]) return true;
  if (!n.kids) return false;
  return n.mode === "un" ? n.kids.some(valide) : n.kids.every(k => valide(k) || estBarre(k));
}

function basculer(n, on) {
  if (verrouillee(n)) { rendu(); return; }
  if (on) {
    etat.coches[n.id] = true;
    cascade(n).forEach(d => etat.coches[d.id] = true);
    // branches au choix : cocher dans une branche efface les autres
    [n, ...anc(n)].forEach(x => {
      const p = PARENT[x.id];
      if (p && p.mode === "un") p.kids.filter(k => k !== x).forEach(k => { delete etat.coches[k.id]; desc(k).forEach(d => delete etat.coches[d.id]); });
    });
    // contraste : l'option choisie barre les autres
    const p = PARENT[n.id];
    if (p && p.choix) { p.kids.forEach(k => { if (k === n) delete etat.barres[k.id]; else etat.barres[k.id] = true; }); }
  } else {
    delete etat.coches[n.id];
    desc(n).forEach(d => delete etat.coches[d.id]);
    anc(n).forEach(a => delete etat.coches[a.id]);
    const p = PARENT[n.id];
    if (p && p.choix) p.kids.forEach(k => delete etat.barres[k.id]);
  }
  sauver(); rendu();
}

/* ═══ Résultats : 5 informations selon les cases ═══ */
const manquants = n => (n.kids || []).flatMap(k => estBarre(k) || valide(k) ? [] : k.kids ? manquants(k) : [k.lib]);
const feuillesActives = n => (n.kids || []).flatMap(k => estBarre(k) ? [] : k.kids ? feuillesActives(k) : [k]);
const fiche = k => (etat.fiche[k] || "").trim();
function delaiDLPI() {
  if (!fiche("dlpi")) return "DLPI non renseignée";
  const j = Math.round((new Date(fiche("dlpi") + "T00:00") - new Date(new Date().toDateString())) / 864e5);
  return j > 0 ? `J-${j} avant la DLPI` : j === 0 ? "DLPI aujourd'hui" : `DLPI dépassée de ${-j} j`;
}
function resultat(t) {
  const cab = fiche("cab") || "Cabinet conseil", D = delaiDLPI();
  const qui = n => n.resp === "cab" ? cab : (n.resp || "Moi");
  if (verrouillee(t)) { const p = TACHES.indexOf(t); return { tag: "none", txt: "Verrouillée", statut: "Pas encore accessible", decision: "—", action: `Valider d'abord l'étape ${p} · ${TACHES[p - 1].lib}`, resp: "—", delai: D }; }
  if (t.mode === "un") {
    // première branche = issue favorable, seconde = blocage
    const [a, b] = t.kids;
    if (valide(a)) return { tag: "ok", txt: a.court, statut: a.court, decision: "Accepté", action: t.apres, resp: "Moi", delai: D };
    if (valide(b)) return { tag: "ko", txt: b.court, statut: b.court, decision: "Suspendu", action: b.attente, resp: qui(b), delai: D };
    const enA = a.kids.some(valide), enB = b.kids.some(valide);
    if (etat.coches[t.id] && !enA && !enB) return { tag: "ok", txt: "Validée", statut: "Validée sans précision", decision: "À préciser", action: `Indiquer « ${a.court} » ou « ${b.court} »`, resp: "Moi", delai: D };
    if (enA) return { tag: "run", txt: "En cours", statut: `Vers « ${a.court} »`, decision: "En cours", action: manquants(a), resp: "Moi", delai: D };
    if (enB) return { tag: "run", txt: "En cours", statut: `Vers « ${b.court} »`, decision: "En cours", action: manquants(b), resp: "Moi", delai: D };
    return { tag: "none", txt: "À contrôler", statut: "Pas encore contrôlé", decision: "—", action: `Choisir « ${a.court} » ou « ${b.court} »`, resp: "Moi", delai: D };
  }
  if (valide(t)) return { tag: "ok", txt: "Validée", statut: t.okStatut || "Étape validée", decision: t.okDecision || "—", action: t.apres || "Passer à l'étape suivante", resp: "Moi", delai: D };
  const m = manquants(t), fa = feuillesActives(t), total = fa.length, fait = fa.filter(valide).length;
  if (fait > 0 || t.enCours) return { tag: "run", txt: t.enCours || "En cours", statut: `${t.lib} : ${fait}/${total}`, decision: t.attente || "En cours", action: m, resp: qui(t), delai: D };
  return { tag: "none", txt: "À faire", statut: "Pas commencée", decision: "—", action: m, resp: qui(t), delai: D };
}

/* ═══ Outils des tâches : date (comme la DLPI) et lien vers le Modop sur OneDrive ═══ */
const AVEC_DATE = new Set(["t1", "t2_1_1", "t2_1_2", "t5_1_1", "t5_1_2", "t6_7", "t6_9", "t7", "t7_5", "t7_6"]);
const AVEC_MODOP = new Set(["t1_5", "t2_1_1_1", "t2_1_2_1", "t3_2", "t3_3", "t3_3_1", "t3_4", "t3_4_1", "t4_1_1", "t4_2_2", "t4_2_4_1",
  "t4_2_5", "t4_2_7", "t4_2_8", "t4_2_9", "t5_1_1_1", "t5_1_2_1", "t6_1", "t6_2", "t6_2_1", "t6_3", "t6_4", "t6_5", "t6_6", "t6_7_1", "t6_8",
  "t6_9", "t7_1", "t7_2", "t7_3", "t7_4_1_2", "t7_4_2_1", "t7_4_3_1", "t7_4_3_2", "t7_4_5_1", "t7_5"]);
const ICO_CAL = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
const ICO_DOC = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
function outilsHTML(n) {
  let h = "";
  if (AVEC_DATE.has(n.id)) h += `<span class="date-mini date-champ"><input data-date="${n.id}" id="dt_${n.id}" value="${isoVersFr(etat.dates[n.id])}" placeholder="JJ/MM/AAAA" inputmode="numeric" maxlength="10" autocomplete="off" aria-label="Date · ${esc(n.lib)}">` +
    `<button class="cal" type="button" data-calbtn="${n.id}" aria-label="Choisir la date dans le calendrier" title="Calendrier">${ICO_CAL}</button>` +
    `<input type="date" class="date-cachee" data-calpick="${n.id}" tabindex="-1" aria-hidden="true"></span>`;
  if (AVEC_MODOP.has(n.id)) {
    const l = etat.liens[n.id];
    h += `<span class="modop"><button class="modop-btn ${l ? "plein" : "vide"}" type="button" data-lien="${n.id}" aria-label="${l ? "Ouvrir le Modop" : "Ajouter le lien du Modop"}" title="${l ? "Ouvrir le Modop" : "Ajouter le lien OneDrive du Modop"}">${ICO_DOC}</button>` +
      (l ? `<button class="lien-edit" type="button" data-lienedit="${n.id}" aria-label="Changer ou retirer le lien" title="Changer ou retirer le lien">✎</button>` : "") + `</span>`;
  }
  return h ? `<span class="outils">${h}</span>` : "";
}

/* ═══ Rendu ═══ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ligneHTML(n, d, num) {
  const v = valide(n), auto = v && !etat.coches[n.id];
  let h = `<div class="ligne d${d}${v ? " valide" : ""}${estBarre(n) ? " barre" : ""}${n.id === noteChoisie ? " choisie" : ""}">`;
  if (d === 1) h += n.kids ? `<button class="chev" type="button" data-chev="${n.id}" aria-label="Réduire ou déplier" aria-expanded="${!etat.fermes[n.id]}">▼</button>` : `<span class="chev vide" aria-hidden="true"></span>`;
  h += `<input type="checkbox" class="cb${auto ? " auto" : ""}" id="cb_${n.id}" data-cb="${n.id}"${v ? " checked" : ""}${verrouillee(n) ? " disabled" : ""} aria-label="${esc(n.lib)}">`;
  // le texte ne coche pas : seule la case coche ; un clic sur le texte affiche le commentaire de la tâche
  h += `<span class="lib" data-note="${n.id}">${d === 1 ? `<span class="num">${num}</span>` : ""}${esc(n.lib)}</span>`;
  h += outilsHTML(n);
  if (d === 1) { const r = resultat(n), ok = r.tag === "ok"; h += `<span class="led ${ok ? "on" : "off"}" role="img" aria-label="${esc(r.txt)}" title="${esc(r.txt)}"></span>`; }
  h += `</div>`;
  if (n.kids) {
    const inner = n.kids.map((k, i) => (n.mode === "un" && !n.choix && i > 0 ? `<div class="ou">ou</div>` : "") + ligneHTML(k, d + 1)).join("");
    h += d === 1 ? `<div class="enfants">${inner}</div>` : inner;
  }
  return h;
}

/* une tâche est acquise quand elle est validée sans être bloquante (non conforme = suspendu) */
const acquise = t => !verrouillee(t) && valide(t) && resultat(t).tag !== "ko";
/* plus de verrouillage : toutes les étapes restent accessibles */
const racine = n => { let r = n; while (PARENT[r.id]) r = PARENT[r.id]; return r; };
function verrouillee(n) { return false; }
function etapeCourante() { return TACHES.find(t => !acquise(t)) || null; }

function rendu() {
  const focus = document.activeElement && document.activeElement.id;
  const sel = etapeCourante();
  $("arbre").innerHTML = TACHES.map((t, i) =>
    `<div class="gt${etat.fermes[t.id] || verrouillee(t) ? " ferme" : ""}${verrouillee(t) ? " verrou" : ""}${t === sel ? " actif" : ""}">${ligneHTML(t, 1, i + 1)}</div>`).join("");

  const nbOk = TACHES.filter(acquise).length;
  $("compteur").textContent = `${nbOk} / ${TACHES.length}`;
  $("compteur").className = "tag " + (nbOk === TACHES.length ? "ok" : nbOk ? "run" : "none");

  rendreMemo();
  if (focus && $(focus) && document.activeElement !== $(focus)) $(focus).focus();
}

/* clic : coche ou décoche ; double-clic : barre ou débarre la tâche (les deux clics sont annulés) */
let dernierClic = { id: null, t: 0 };
document.addEventListener("change", e => {
  const id = e.target.dataset.cb; if (!id) return;
  const t = Date.now();
  if (dernierClic.id === id && t - dernierClic.t < 450) {
    etat.coches = dernierClic.coches; etat.barres = dernierClic.barres; etat.memo = dernierClic.memo;
    if (etat.barres[id]) delete etat.barres[id]; else etat.barres[id] = true;
    dernierClic = { id: null, t: 0 };
    sauver(); rendu(); return;
  }
  dernierClic = { id, t, coches: { ...etat.coches }, barres: { ...etat.barres }, memo: JSON.parse(JSON.stringify(etat.memo)) };
  const avant = new Set(Object.keys(NOEUDS).filter(k => valide(NOEUDS[k])));
  basculer(NOEUDS[id], e.target.checked);
  if (e.target.checked) noterCoches(avant);
});
document.addEventListener("click", e => {
  const c = e.target.closest("[data-chev]");
  if (c) { const id = c.dataset.chev; etat.fermes[id] = !etat.fermes[id]; sauver(); rendu(); return; }
  const n = e.target.closest("[data-note]");
  if (n) afficherNote(n.dataset.note);
});

/* fiche */
document.querySelectorAll("[data-f]").forEach(inp => {
  inp.value = etat.fiche[inp.dataset.f] || "";
  inp.addEventListener("input", () => {
    if (inp.id === "f_el") inp.value = inp.value.replace(/\D/g, "");   // Nombre d'EL : chiffres seulement
    etat.fiche[inp.dataset.f] = inp.value; sauver(); rendu();
  });
});

/* ═══ Dates des tâches : même saisie que la DLPI ═══ */
const formaterDate = v => { const ch = v.replace(/\D/g, "").slice(0, 8); return ch.length > 4 ? `${ch.slice(0, 2)}/${ch.slice(2, 4)}/${ch.slice(4)}` : ch.length > 2 ? `${ch.slice(0, 2)}/${ch.slice(2)}` : ch; };
$("arbre").addEventListener("input", e => {
  const id = e.target.dataset.date; if (!id) return;
  e.target.value = formaterDate(e.target.value);
  const iso = frVersIso(e.target.value), vide = !e.target.value;
  e.target.classList.toggle("invalide", e.target.value.length === 10 && !iso);
  if (iso) etat.dates[id] = iso; else if (vide) delete etat.dates[id];
  if (iso || vide) sauver();
});
$("arbre").addEventListener("focusout", e => {
  const id = e.target.dataset.date; if (!id) return;
  if (!frVersIso(e.target.value)) { e.target.value = isoVersFr(etat.dates[id]); e.target.classList.remove("invalide"); }
});
$("arbre").addEventListener("click", e => {
  const b = e.target.closest("[data-calbtn]"); if (!b) return;
  const pick = b.parentElement.querySelector("[data-calpick]");
  pick.value = etat.dates[b.dataset.calbtn] || versIso(new Date());
  try { pick.showPicker(); } catch (err) { pick.focus(); pick.click(); }
});
$("arbre").addEventListener("change", e => {
  const id = e.target.dataset.calpick; if (!id || !e.target.value) return;
  etat.dates[id] = e.target.value; sauver();
  const champ = $("dt_" + id); if (champ) { champ.value = isoVersFr(e.target.value); champ.classList.remove("invalide"); }
});

/* ═══ Liens Modop (OneDrive), un par tâche : clic = ouvrir ; sans lien = coller le lien ; ✎ = changer ou retirer ═══ */
let lienPop = null;
function fermerLienPop() { if (lienPop) { lienPop.remove(); lienPop = null; } }
function ouvrirLienPop(id, ancre, titre) {
  fermerLienPop();
  const actuel = etat.liens[id] || "";
  titre = titre || `Lien du Modop · ${NOEUDS[id].lib}`;
  lienPop = document.createElement("div");
  lienPop.className = "lien-pop";
  lienPop.innerHTML = `<div class="bulle-titre">${esc(titre)}</div>
    <input type="url" id="lienSaisie" placeholder="Colle le lien OneDrive (clic droit › Copier le lien)" value="${esc(actuel)}">
    <div class="ko" id="lienErreur" hidden>Le lien doit commencer par https://</div>
    <div class="actions">${actuel ? '<button class="btn btn-mini" type="button" data-pop="retirer">Retirer le lien</button>' : ""}
      <button class="btn btn-mini" type="button" data-pop="annuler">Annuler</button>
      <button class="btn btn-mini btn-accent" type="button" data-pop="ok">Enregistrer</button></div>`;
  document.body.appendChild(lienPop);
  const r = ancre.getBoundingClientRect(), w = lienPop.offsetWidth, hh = lienPop.offsetHeight;
  lienPop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  lienPop.style.top = (r.bottom + 6 + hh > innerHeight ? Math.max(8, r.top - hh - 6) : r.bottom + 6) + "px";
  const saisie = lienPop.querySelector("#lienSaisie");
  saisie.focus(); saisie.select();
  const enregistrer = () => {
    const v = saisie.value.trim();
    if (!/^https?:\/\//i.test(v)) { lienPop.querySelector("#lienErreur").hidden = false; return; }
    etat.liens[id] = v; sauver(); fermerLienPop(); rendu(); majDocs();
  };
  saisie.addEventListener("keydown", e => { if (e.key === "Enter") enregistrer(); });
  lienPop.addEventListener("click", e => {
    const a = e.target.closest("[data-pop]")?.dataset.pop;
    if (a === "ok") enregistrer();
    else if (a === "annuler") fermerLienPop();
    else if (a === "retirer") { delete etat.liens[id]; sauver(); fermerLienPop(); rendu(); majDocs(); }
  });
}
$("arbre").addEventListener("click", e => {
  const ed = e.target.closest("[data-lienedit]");
  if (ed) { ouvrirLienPop(ed.dataset.lienedit, ed); return; }
  const b = e.target.closest("[data-lien]"); if (!b) return;
  const l = etat.liens[b.dataset.lien];
  if (l) window.open(l, "_blank", "noopener"); else ouvrirLienPop(b.dataset.lien, b);
});
document.addEventListener("pointerdown", e => { if (lienPop && !lienPop.contains(e.target) && !e.target.closest("[data-lien],[data-lienedit],#docsTuile,#docsEdit")) fermerLienPop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && lienPop) fermerLienPop(); });

/* ═══ DLPI : JJ/MM/AAAA au clavier, ou calendrier ; enregistrée en AAAA-MM-JJ ═══ */
const dlpi = $("f_dlpi"), dlpiCal = $("f_dlpi_cal");
const isoVersFr = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
function frVersIso(fr) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(fr); if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? `${m[3]}-${m[2]}-${m[1]}` : null;
}
function poserDlpi(iso) { etat.fiche.dlpi = iso; dlpi.value = isoVersFr(iso); dlpi.classList.remove("invalide"); sauver(); rendu(); }
dlpi.value = isoVersFr(etat.fiche.dlpi);
dlpi.addEventListener("input", () => {
  // barres ajoutées toutes seules : 08102026 → 08/10/2026
  const ch = dlpi.value.replace(/\D/g, "").slice(0, 8);
  dlpi.value = ch.length > 4 ? `${ch.slice(0, 2)}/${ch.slice(2, 4)}/${ch.slice(4)}` : ch.length > 2 ? `${ch.slice(0, 2)}/${ch.slice(2)}` : ch;
  const iso = frVersIso(dlpi.value);
  dlpi.classList.toggle("invalide", ch.length === 8 && !iso);
  if (iso || ch.length === 0) { etat.fiche.dlpi = iso || ""; sauver(); rendu(); }
});
dlpi.addEventListener("blur", () => { if (!frVersIso(dlpi.value)) { dlpi.value = isoVersFr(etat.fiche.dlpi); dlpi.classList.remove("invalide"); } });
$("calDlpi").onclick = () => {
  dlpiCal.value = etat.fiche.dlpi || versIso(new Date());
  try { dlpiCal.showPicker(); } catch (e) { dlpiCal.focus(); dlpiCal.click(); }
};
dlpiCal.addEventListener("change", () => { if (dlpiCal.value) poserDlpi(dlpiCal.value); });

/* ═══ Regroupement syndic : autant d'IMB que voulu, défilement horizontal ═══
   chaque IMB : { imb, adr, el, elR, elP, note } ; adresse, EL et commentaire dans une bulle au survol */
const imbVide = (imb = "") => ({ imb, adr: "", el: "", elR: "", elP: "", note: "" });
if (!Array.isArray(etat.fiche.imbs)) {
  // anciens dossiers : les 4 cases IMB fixes deviennent la liste
  etat.fiche.imbs = [1, 2, 3, 4].map(i => etat.fiche["imb" + i] || "");
  [1, 2, 3, 4].forEach(i => delete etat.fiche["imb" + i]);
}
etat.fiche.imbs = etat.fiche.imbs.map(x => typeof x === "string" ? imbVide(x) : Object.assign(imbVide(), x));
while (etat.fiche.imbs.length < 4) etat.fiche.imbs.push(imbVide());
const aInfo = o => !!(o.adr || o.el || o.elR || o.elP || o.note);
function rendreImbs(focusIndex) {
  const L = etat.fiche.imbs, liste = $("imbListe");
  liste.innerHTML = L.map((o, i) =>
    `<div class="imb-item${aInfo(o) ? " info" : ""}${i === imbOuvert ? " actif" : ""}" data-item="${i}"><input id="imb${i}" data-imb="${i}" value="${esc(o.imb)}" placeholder="IMB/…" aria-label="IMB ${i + 1}" autocomplete="off">` +
    (L.length > 4 && !o.imb.trim() && !aInfo(o) ? `<button class="suppr" type="button" data-suppr="${i}" aria-label="Supprimer la case IMB ${i + 1}" title="Supprimer">×</button>` : "") +
    `</div>`).join("") + `<button class="imb-plus" type="button" id="imbPlus" aria-label="Ajouter un IMB" title="Ajouter un IMB">+</button>`;
  if (focusIndex != null) { const f = $("imb" + focusIndex); f.focus(); f.scrollIntoView({ block: "nearest", inline: "nearest" }); }
}
$("imbListe").addEventListener("input", e => {
  const i = e.target.dataset.imb; if (i == null) return;
  const o = etat.fiche.imbs[i], avant = o.imb.trim();
  o.imb = e.target.value; sauver();
  if (+i === imbOuvert) $("imbBulleTitre").textContent = o.imb.trim() || `IMB ${+i + 1}`;
  if (etat.fiche.imbs.length > 4 && !avant !== !o.imb.trim()) rendreImbs(+i);   // affiche ou retire la croix
});
$("imbListe").addEventListener("click", e => {
  if (e.target.closest("#imbPlus")) { fermerImb(); etat.fiche.imbs.push(imbVide()); sauver(); rendreImbs(etat.fiche.imbs.length - 1); return; }
  const s = e.target.closest("[data-suppr]");
  if (s) { fermerImb(); etat.fiche.imbs.splice(+s.dataset.suppr, 1); sauver(); rendreImbs(); }
});

/* bulle d'un IMB : s'ouvre au survol, se ferme quand la souris quitte la case et la bulle (ou avec Échap) */
let imbOuvert = null;
const imbBulle = $("imbBulle");
function ouvrirImb(i) {
  const item = document.querySelector(`[data-item="${i}"]`); if (!item) return;
  if (imbBulle.contains(document.activeElement)) document.activeElement.blur();   // ce qui est tapé reste sur l'IMB précédent
  imbOuvert = i;
  const o = etat.fiche.imbs[i];
  $("imbBulleTitre").textContent = o.imb.trim() || `IMB ${i + 1}`;
  imbBulle.querySelectorAll("[data-info]").forEach(c => c.value = o[c.dataset.info] || "");
  imbBulle.hidden = false;
  // sous la case survolée, sans sortir de la carte
  const zone = $("regroupZone").getBoundingClientRect(), r = item.getBoundingClientRect();
  const larg = imbBulle.offsetWidth;

/* ═══ Import de l'export Excel des IMB (une ligne par IMB, un seul regroupement par fichier) ═══
   colonnes : A Dossier (IMB), D Code Regroupement Syndic, W..AD adresse, AU / AV / AW logements (total, R = particuliers, P = pro) */
const SHEETJS = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
function chargerSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = SHEETJS; sc.onload = ok; sc.onerror = () => ko(new Error("lecteur Excel introuvable (connexion internet ?)")); document.head.appendChild(sc); });
}
const COL = { imb: 0, regroup: 3, num: 22, cplt: 23, voie: 24, adresse: 25, bat: 26, esc: 27, cp: 28, loc: 29, el: 46, elR: 47, elP: 48 };
const txt = v => (v == null ? "" : String(v)).trim();
const nombre = v => { const t = txt(v).replace(",", "."); return t === "" || isNaN(+t) ? t.replace(/\D/g, "") : String(Math.round(+t)); };
function adresseLigne(r) {
  const rue = [txt(r[COL.num]), txt(r[COL.cplt]), txt(r[COL.voie])].filter(Boolean).join(" ");
  const ad = txt(r[COL.adresse]);
  const parts = [];
  if (rue) parts.push(rue);
  if (ad && (!rue || !ad.toLowerCase().includes(rue.toLowerCase()))) parts.push(ad);
  if (txt(r[COL.bat])) parts.push("Bât. " + txt(r[COL.bat]));
  if (txt(r[COL.esc])) parts.push("Esc. " + txt(r[COL.esc]));
  const ville = [txt(r[COL.cp]), txt(r[COL.loc])].filter(Boolean).join(" ");
  if (ville) parts.push(ville);
  return parts.join(", ");
}
function messageImport(t, ko) { const m = $("importMsg"); m.textContent = t; m.classList.toggle("ko", !!ko); m.hidden = false; clearTimeout(m._t); m._t = setTimeout(() => m.hidden = true, 6000); }
$("imbFichier").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    await chargerSheetJS();
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const lignes = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: true });
    // la ligne d'en-tête est celle dont la colonne A vaut « Dossier »
    const h = lignes.findIndex(r => txt(r[0]).toLowerCase() === "dossier");
    if (h < 0) throw new Error("colonne « Dossier » introuvable");
    const data = lignes.slice(h + 1).filter(r => txt(r[COL.imb]));
    if (!data.length) throw new Error("aucun IMB dans le fichier");
    const actuels = etat.fiche.imbs.filter(o => o.imb.trim());
    if (actuels.length && !confirm(`Remplacer les ${actuels.length} IMB actuels par les ${data.length} du fichier ?`)) return;
    const notes = Object.fromEntries(etat.fiche.imbs.filter(o => o.imb.trim() && o.note).map(o => [o.imb.trim(), o.note]));
    fermerImb();
    etat.fiche.imbs = data.map(r => ({ imb: txt(r[COL.imb]), adr: adresseLigne(r), el: nombre(r[COL.el]), elR: nombre(r[COL.elR]), elP: nombre(r[COL.elP]),
      note: notes[txt(r[COL.imb])] || "" }));   // un commentaire déjà écrit sur le même IMB est gardé
    while (etat.fiche.imbs.length < 4) etat.fiche.imbs.push(imbVide());
    const code = data.map(r => txt(r[COL.regroup])).find(Boolean);
    if (code) { etat.fiche.ref = code; $("f_ref").value = code; }
    sauver(); rendreImbs(); rendu();
    messageImport(`${data.length} IMB importés${code ? " · regroupement " + code : ""}`);
  } catch (err) { messageImport("Import impossible : " + err.message, true); }
});

// réduit l'image (1400 px max, JPEG) pour tenir dans la mémoire du navigateur
function reduire(fichier) {
  return new Promise((ok, ko) => {
    const lect = new FileReader();
    lect.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = ko; img.src = lect.result;
    };
    lect.onerror = ko; lect.readAsDataURL(fichier);
  });
}
async function ajouterCaptures(fichiers) {
  for (const f of fichiers) {
    if (!f.type.startsWith("image/")) continue;
    try { captures.push(await reduire(f)); } catch (e) { continue; }
    if (!sauverCaptures()) { captures.pop(); sauverCaptures(); alert("Plus de place pour d'autres captures : retires-en une avant d'en ajouter."); break; }
  }
  rendreCaptures();
}

/* ═══ Commentaires : mémo daté des tâches cochées + commentaire et captures de chaque tâche ═══

const NCAPCLE = "racco-d2-notes-captures";

// tâches qui viennent de passer à « faites » : la tâche cochée et ses sous-tâches
function noterCoches(avant) {
  const j = aujourdhui();
  let rang = Date.now() * 1000;   // dans l'ordre de la liste des tâches
  Object.keys(NOEUDS).forEach(k => { if (!avant.has(k) && valide(NOEUDS[k]) && etat.coches[k]) { const m = entree(k); m.coche = j; m.ordreCoche = rang++; } });
  sauver(); rendreMemo();
}
function rendreMemo() {
  const L = Object.entries(etat.memo).filter(([k]) => NOEUDS[k]).sort((a, b) => (a[1].ordreCoche || a[1].ordre) - (b[1].ordreCoche || b[1].ordre));
  $("memo").innerHTML = L.length ? L.map(([k, m]) => {
    const n = NOEUDS[k], d = m.coche || m.noteDate;
    const etatTxt = estBarre(n) ? `<span class="mt barree">barrée</span>` : m.coche && !valide(n) ? `<span class="mt decochee">décochée</span>` : "";
    const aNote = m.note.trim() || (notesCaptures[k] || []).length;
    return `<div class="memo-ligne${k === noteChoisie ? " sel" : ""}" data-memo="${k}"><span class="md">${d ? isoVersFr(d) : "—"}</span><span class="mn" title="${esc(cheminTache(n) ? cheminTache(n) + " › " + n.lib : n.lib)}">${esc(n.lib)}</span>${etatTxt}${aNote ? '<span class="mc" title="Commentaire">●</span>' : ""}<button class="msup" type="button" data-memosup="${k}" title="Retirer du mémo" aria-label="Retirer du mémo">×</button></div>`;
  }).join("") : `<div class="memo-vide">Les tâches cochées s'inscrivent ici, avec la date.</div>`;
}

  noteChoisie = id;

  $("noteAide").hidden = true; $("noteDetail").hidden = false;
  $("noteChemin").textContent = cheminTache(n);
  $("noteTitre").textContent = n.lib;
  const morceaux = [];

  if (m && m.noteDate) morceaux.push(`Commentaire du ${isoVersFr(m.noteDate)}`);
  if (estBarre(n)) morceaux.push("Tâche barrée");

  if (!noteChoisie) return;
  const m = entree(noteChoisie); m.note = $("noteTache").value; m.noteDate = aujourdhui();
  sauver(); rendreMemo();
  const d = $("noteDates").textContent;
  if (!/Commentaire du/.test(d)) afficherNoteDates();
});
function afficherNoteDates() { const m = etat.memo[noteChoisie]; if (!m) return; const p = []; if (m.coche) p.push(`Cochée le ${isoVersFr(m.coche)}`); if (m.noteDate) p.push(`Commentaire du ${isoVersFr(m.noteDate)}`); if (estBarre(NOEUDS[noteChoisie])) p.push("Tâche barrée"); $("noteDates").textContent = p.join(" · "); }
function rendreNoteCaptures() {
  const L = notesCaptures[noteChoisie] || [];
  $("noteCaptures").innerHTML = L.map((src, i) => `<div class="capture" data-nvoir="${i}"><img src="${src}" alt="Capture ${i + 1}"><button type="button" data-nret="${i}" aria-label="Retirer la capture ${i + 1}" title="Retirer">×</button></div>`).join("");
}
async function ajouterNoteCaptures(fichiers) {
  if (!noteChoisie) return;
  const id = noteChoisie, L = notesCaptures[id] || (notesCaptures[id] = []);
  for (const f of fichiers) {
    if (!f.type.startsWith("image/")) continue;
    try { L.push(await reduire(f)); } catch (e) { continue; }
    if (!sauverNotesCaptures()) { L.pop(); sauverNotesCaptures(); alert("Plus de place pour d'autres captures : retires-en une avant d'en ajouter."); break; }
  }
  const m = entree(id); m.noteDate = aujourdhui(); sauver();
  rendreNoteCaptures(); rendreMemo(); afficherNoteDates();
}
$("noteTacheFichier").addEventListener("change", e => { ajouterNoteCaptures([...e.target.files]); e.target.value = ""; });
$("noteDetail").addEventListener("paste", e => { const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/")); if (imgs.length) { e.preventDefault(); ajouterNoteCaptures(imgs); } });
$("noteDetail").addEventListener("dragover", e => { e.preventDefault(); $("noteDetail").classList.add("depot"); });
$("noteDetail").addEventListener("dragleave", () => $("noteDetail").classList.remove("depot"));
$("noteDetail").addEventListener("drop", e => { e.preventDefault(); $("noteDetail").classList.remove("depot"); ajouterNoteCaptures([...e.dataTransfer.files]); });
$("noteCaptures").addEventListener("click", e => {
  const r = e.target.closest("[data-nret]");
  if (r) { notesCaptures[noteChoisie].splice(+r.dataset.nret, 1); sauverNotesCaptures(); rendreNoteCaptures(); rendreMemo(); return; }
  const v = e.target.closest("[data-nvoir]");
  if (v) { const vis = document.createElement("div"); vis.className = "visionneuse"; vis.innerHTML = `<img src="${notesCaptures[noteChoisie][+v.dataset.nvoir]}" alt="Capture agrandie">`; vis.onclick = () => vis.remove(); document.body.appendChild(vis); }
});

/* ═══ Grand écran : la page grossit pour remplir l'écran, sans que la colonne droite dépasse la hauteur ═══ */
const LARGEUR_BASE = 1440;
function ajusterEchelle() {
  const page = document.querySelector(".page"), droite = document.querySelector(".col.droite");
  page.style.zoom = ""; page.style.maxWidth = ""; droite.style.maxHeight = "";
  if (innerWidth < 1150) return;
  const parLargeur = innerWidth / LARGEUR_BASE;
  // tout doit tenir à l'ouverture : bandeau du haut + colonne droite + marge du bas
  const haut = droite.getBoundingClientRect().top + scrollY;
  const parHauteur = innerHeight / (haut + droite.scrollHeight + 16);
  const z = Math.max(1, Math.min(parLargeur, parHauteur, 2));
  if (z <= 1.02) return;
  page.style.zoom = z;
  page.style.maxWidth = "none";
  droite.style.maxHeight = `${(innerHeight - 24) / z}px`;
}
let attenteEchelle;
addEventListener("resize", () => { clearTimeout(attenteEchelle); attenteEchelle = setTimeout(ajusterEchelle, 100); });

majUrgence(); majDocs(); rendu(); ajusterEchelle();
</script>
